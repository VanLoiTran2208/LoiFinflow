    // Helper tiền tệ VND
    function formatVND(num) {
      return new Intl.NumberFormat('vi-VN', {
        style: 'currency',
        currency: 'VND',
        maximumFractionDigits: 0,
      }).format(num || 0);
    }

    function compactVND(num) {
      if (Math.abs(num) >= 1000000000) return (num / 1000000000).toFixed(1) + ' tỷ';
      if (Math.abs(num) >= 1000000) return (num / 1000000).toFixed(1) + ' tr';
      if (Math.abs(num) >= 1000) return (num / 1000).toFixed(0) + ' k';
      return (num || 0) + ' đ';
    }

    function getInitials(name) {
      if (!name) return 'U';
      const parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    // Helper xử lý tháng (YYYY-MM)
    function formatMonthDisplay(monthKey) {
      if (!monthKey || !monthKey.includes('-')) return monthKey || '';
      const [year, month] = monthKey.split('-');
      return `Tháng ${month}/${year}`;
    }

    function getPreviousMonth(monthKey) {
      if (!monthKey || !monthKey.includes('-')) return '2026-09';
      const [yearStr, monthStr] = monthKey.split('-');
      let year = parseInt(yearStr, 10);
      let month = parseInt(monthStr, 10);
      month -= 1;
      if (month < 1) {
        month = 12;
        year -= 1;
      }
      return `${year}-${String(month).padStart(2, '0')}`;
    }

    function getNextMonth(monthKey) {
      if (!monthKey || !monthKey.includes('-')) return '2026-11';
      const [yearStr, monthStr] = monthKey.split('-');
      let year = parseInt(yearStr, 10);
      let month = parseInt(monthStr, 10);
      month += 1;
      if (month > 12) {
        month = 1;
        year += 1;
      }
      return `${year}-${String(month).padStart(2, '0')}`;
    }

    // ==========================================
    // SMART DATA MERGE & AUTO-HEALING HELPERS (BẢO TOÀN DỮ LIỆU VĨNH VIỄN)
    // ==========================================
    // Hợp nhất danh sách giao dịch an toàn (Không bao giờ xóa mất chi tiêu của người dùng)
    function mergeTransactionLists(localList = [], serverList = [], tombstones = new Set()) {
      const map = new Map();
      
      // 1. Nạp giao dịch từ server trước (bỏ qua những cái đã xóa)
      if (Array.isArray(serverList)) {
        for (const tx of serverList) {
          if (tx && tx.id && !tombstones.has(tx.id)) {
            map.set(tx.id, tx);
          }
        }
      }
      
      // 2. Nạp giao dịch từ local (ưu tiên local mới hơn hoặc giao dịch người dùng vừa nhập trên máy)
      if (Array.isArray(localList)) {
        for (const tx of localList) {
          if (tx && tx.id && !tombstones.has(tx.id)) {
            map.set(tx.id, tx);
          }
        }
      }

      const merged = Array.from(map.values());
      // Sắp xếp ngày mới nhất lên đầu
      merged.sort((a, b) => {
        const timeA = new Date(a.date || 0).getTime();
        const timeB = new Date(b.date || 0).getTime();
        return timeB - timeA;
      });
      return merged;
    }

    // Hợp nhất kho dữ liệu cá nhân (Personal Data Store)
    function smartMergePersonalStores(localStore = {}, serverStore = {}, tombstones = new Set()) {
      const result = { ...(serverStore || {}), ...(localStore || {}) };
      const allUserIds = Array.from(new Set([...Object.keys(localStore || {}), ...Object.keys(serverStore || {})]));

      for (const uid of allUserIds) {
        const localUser = (localStore && localStore[uid]) || null;
        const serverUser = (serverStore && serverStore[uid]) || null;

        if (localUser && serverUser) {
          result[uid] = {
            ...serverUser,
            ...localUser,
            monthlyBudgets: {
              ...(serverUser.monthlyBudgets || {}),
              ...(localUser.monthlyBudgets || {})
            },
            transactions: mergeTransactionLists(localUser.transactions, serverUser.transactions, tombstones)
          };
        } else if (localUser) {
          result[uid] = {
            ...localUser,
            transactions: mergeTransactionLists(localUser.transactions, [], tombstones)
          };
        } else if (serverUser) {
          result[uid] = {
            ...serverUser,
            transactions: mergeTransactionLists([], serverUser.transactions, tombstones)
          };
        }
      }
      return result;
    }

    // Hợp nhất kho dữ liệu gia đình (Family Data Store)
    function smartMergeFamilyStore(localFamily = {}, serverFamily = {}, tombstones = new Set()) {
      if (!localFamily && !serverFamily) return null;
      if (!serverFamily) return localFamily;
      if (!localFamily) return serverFamily;

      return {
        ...serverFamily,
        ...localFamily,
        monthlyBudgets: {
          ...(serverFamily.monthlyBudgets || {}),
          ...(localFamily.monthlyBudgets || {})
        },
        transactions: mergeTransactionLists(localFamily.transactions, serverFamily.transactions, tombstones)
      };
    }

    // Kiểm tra xem Local có chứa giao dịch mà Server đang bị thiếu không (để tự động chữa lành/push lên server)
    function checkLocalHasMissingOnServer(localStore = {}, serverStore = {}) {
      if (!localStore) return false;
      if (!serverStore) return true;
      for (const uid of Object.keys(localStore)) {
        const localTxs = localStore[uid]?.transactions || [];
        const serverTxs = serverStore[uid]?.transactions || [];
        const serverIds = new Set(serverTxs.map(t => t.id));
        for (const tx of localTxs) {
          if (tx && tx.id && !serverIds.has(tx.id)) return true;
        }
      }
      return false;
    }

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      // 1. ACCOUNTS & SESSION STATE
      const [accounts, setAccounts] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY_ACCOUNTS);
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return INITIAL_ACCOUNTS;
      });

      // currentUser: BẮT BUỘC null sau khi đăng xuất!
      const [currentUserId, setCurrentUserId] = useState(() => {
        return localStorage.getItem(STORAGE_KEY_CURRENT_USER_ID) || null;
      });

      const currentUser = useMemo(() => {
        return accounts.find(a => a.id === currentUserId) || null;
      }, [accounts, currentUserId]);

      // Family group info
      const [familyInfo, setFamilyInfo] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY_FAMILY_INFO);
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return INITIAL_FAMILY_INFO;
      });

      // 2. ISOLATED DATA STORES
      // Personal data: { [userId]: { monthlyIncome, funds, allocations, transactions } }
      const [personalDataStore, setPersonalDataStore] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY_PERSONAL_DATA);
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return INITIAL_PERSONAL_DATA;
      });

      // Family data: { monthlyIncome, funds, allocations, transactions }
      const [familyDataStore, setFamilyDataStore] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY_FAMILY_DATA);
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return INITIAL_FAMILY_DATA;
      });

      // 3. UI STATES
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('finflow_dark');
        return saved ? JSON.parse(saved) : true;
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedMonth, setSelectedMonth] = useState(() => {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        return `${y}-${m}`;
      });

      // QUY TẮC PHÂN BỔ TÙY CHỈNH
      const [customRules, setCustomRules] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY_CUSTOM_RULES);
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return INITIAL_CUSTOM_RULES;
      });

      const [isUserMenuOpen, setIsUserMenuOpen] = useState(false);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [lightboxImage, setLightboxImage] = useState(null);
      const [isJoinFamilyModalOpen, setIsJoinFamilyModalOpen] = useState(false);
      const [isMobileQRModalOpen, setIsMobileQRModalOpen] = useState(false);
      const [isChangePasswordModalOpen, setIsChangePasswordModalOpen] = useState(false);

      // Toast notification
      const [toastMessage, setToastMessage] = useState(null);
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // ==========================================
      // REALTIME SYNC & CROSS-DEVICE MANAGER
      // ==========================================
      const deviceId = useMemo(() => {
        let id = sessionStorage.getItem('finflow_device_id');
        if (!id) {
          id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 7);
          sessionStorage.setItem('finflow_device_id', id);
        }
        return id;
      }, []);

      const [syncStatus, setSyncStatus] = useState('connecting'); // 'connected' | 'syncing' | 'offline'
      const [lastSyncTime, setLastSyncTime] = useState(null);
      const [connectedDevicesCount, setConnectedDevicesCount] = useState(1);
      const [networkInfo, setNetworkInfo] = useState({ lanIp: '10.192.38.20', port: 3000, mobileUrl: 'http://10.192.38.20:3000' });
      const isRemoteUpdate = useRef(false);
      const isInitialLoaded = useRef(false);
      const pushTimeoutRef = useRef(null);

      // Danh sách ID giao dịch đã xóa (Tombstones để chống phục hồi nhầm khi hợp nhất)
      const [deletedTxIds, setDeletedTxIds] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY_DELETED_TXS);
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY_DELETED_TXS, JSON.stringify(deletedTxIds));
        } catch (e) {}
      }, [deletedTxIds]);

      // Đẩy dữ liệu lên máy chủ trung tâm
      const pushDataToServer = useCallback((overridePayload) => {
        if (isRemoteUpdate.current) return;
        setSyncStatus('syncing');

        const payload = overridePayload || {
          accounts,
          familyInfo,
          personalDataStore,
          familyDataStore,
          customRules,
          deletedTxIds,
          lastUpdatedBy: currentUser?.fullName || 'Thiết bị',
          lastModified: Date.now()
        };

        fetch('/api/data', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Sender-Device': deviceId
          },
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
          setSyncStatus('connected');
          setLastSyncTime(new Date());
          if (res.connectedDevices) setConnectedDevicesCount(res.connectedDevices);
        })
        .catch(err => {
          console.warn('Sync push fallback locally:', err);
          setSyncStatus('offline');
        });
      }, [accounts, familyInfo, personalDataStore, familyDataStore, customRules, deletedTxIds, currentUser, deviceId]);

      // Cập nhật dữ liệu từ máy chủ trung tâm vào Local State & LocalStorage thông qua Smart Merge
      const applyServerData = useCallback((serverData) => {
        if (!serverData || !serverData.accounts || !Array.isArray(serverData.accounts)) return false;

        isRemoteUpdate.current = true;

        // 1. Cập nhật Tombstones (ID các giao dịch đã xóa)
        let combinedTombstones = new Set(deletedTxIds);
        if (Array.isArray(serverData.deletedTxIds)) {
          serverData.deletedTxIds.forEach(id => combinedTombstones.add(id));
          const updatedTombstonesArray = Array.from(combinedTombstones);
          setDeletedTxIds(updatedTombstonesArray);
          try {
            localStorage.setItem(STORAGE_KEY_DELETED_TXS, JSON.stringify(updatedTombstonesArray));
          } catch (e) {}
        }

        // 2. Hợp nhất danh sách tài khoản (không bao giờ làm mất tài khoản người dùng đã tạo)
        const accountMap = new Map();
        if (Array.isArray(serverData.accounts)) {
          serverData.accounts.forEach(a => accountMap.set(a.id, a));
        }
        setAccounts(prevAccounts => {
          prevAccounts.forEach(a => {
            if (!accountMap.has(a.id)) {
              accountMap.set(a.id, a);
            }
          });
          const mergedAccounts = Array.from(accountMap.values());
          try { localStorage.setItem(STORAGE_KEY_ACCOUNTS, JSON.stringify(mergedAccounts)); } catch (e) {}
          return mergedAccounts;
        });

        // 3. Thông tin gia đình & Quy tắc tùy chỉnh
        if (serverData.familyInfo) {
          setFamilyInfo(serverData.familyInfo);
          try { localStorage.setItem(STORAGE_KEY_FAMILY_INFO, JSON.stringify(serverData.familyInfo)); } catch (e) {}
        }
        if (serverData.customRules) {
          setCustomRules(prev => {
            const mergedRules = Array.isArray(serverData.customRules) ? serverData.customRules : prev;
            try { localStorage.setItem(STORAGE_KEY_CUSTOM_RULES, JSON.stringify(mergedRules)); } catch (e) {}
            return mergedRules;
          });
        }

        // 4. HỢP NHẤT THÔNG MINH (SMART MERGE) KHO GIAO DỊCH CÁ NHÂN & GIA ĐÌNH
        let needServerHealing = false;

        setPersonalDataStore(prevLocalStore => {
          const mergedPersonal = smartMergePersonalStores(prevLocalStore, serverData.personalDataStore, combinedTombstones);
          try { localStorage.setItem(STORAGE_KEY_PERSONAL_DATA, JSON.stringify(mergedPersonal)); } catch (e) {}
          
          if (checkLocalHasMissingOnServer(prevLocalStore, serverData.personalDataStore)) {
            needServerHealing = true;
          }
          return mergedPersonal;
        });

        setFamilyDataStore(prevLocalFamily => {
          const mergedFamily = smartMergeFamilyStore(prevLocalFamily, serverData.familyDataStore, combinedTombstones);
          if (mergedFamily) {
            try { localStorage.setItem(STORAGE_KEY_FAMILY_DATA, JSON.stringify(mergedFamily)); } catch (e) {}
            const localFamilyTxs = prevLocalFamily?.transactions || [];
            const serverFamilyTxs = serverData.familyDataStore?.transactions || [];
            const serverFamilyIds = new Set(serverFamilyTxs.map(t => t.id));
            if (localFamilyTxs.some(t => t && t.id && !serverFamilyIds.has(t.id))) {
              needServerHealing = true;
            }
          }
          return mergedFamily;
        });

        setLastSyncTime(new Date());
        setSyncStatus('connected');

        setTimeout(() => {
          isRemoteUpdate.current = false;
        }, 400);

        // NẾU MÁY CHỦ BỊ KHỞI ĐỘNG LẠI (RENDER RESTART) BỊ THIẾU DỮ LIỆU CỦA NGƯỜI DÙNG -> TỰ ĐỘNG CHỮA LÀNH
        if (needServerHealing) {
          console.log('[FinFlow Auto-Healing] Phục hồi và bổ sung chi tiêu từ Local lên máy chủ trung tâm...');
          setTimeout(() => {
            pushDataToServer();
          }, 600);
        }

        return true;
      }, [deletedTxIds, pushDataToServer]);

      // Nút ép đồng bộ tức thì (Manual Force Sync)
      const handleForceSync = useCallback(() => {
        setSyncStatus('syncing');
        fetch('/api/data')
          .then(r => r.json())
          .then(serverData => {
            if (serverData && serverData.accounts) {
              applyServerData(serverData);
              showToast('🟢 Đã đồng bộ tức thì dữ liệu mới nhất!');
            } else {
              pushDataToServer();
              showToast('🟢 Đã lưu dữ liệu lên máy chủ trung tâm!');
            }
          })
          .catch(() => {
            setSyncStatus('offline');
            showToast('⚠️ Không thể kết nối máy chủ! Dữ liệu vẫn được lưu an toàn tại máy.');
          });
      }, [applyServerData, pushDataToServer]);

      // ==========================================
      // XUẤT (BACKUP) & KHÔI PHỤC (RESTORE) DỮ LIỆU VĨNH VIỄN
      // ==========================================
      const handleExportData = useCallback(() => {
        const backupData = {
          version: 'finflow-v4',
          exportDate: new Date().toISOString(),
          accounts,
          familyInfo,
          personalDataStore,
          familyDataStore,
          customRules,
          deletedTxIds
        };
        const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(backupData, null, 2));
        const downloadAnchor = document.createElement('a');
        const filename = `finflow-backup-${new Date().toISOString().slice(0, 10)}.json`;
        downloadAnchor.setAttribute('href', dataStr);
        downloadAnchor.setAttribute('download', filename);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('📁 Đã tải file sao lưu FinFlow về thiết bị của bạn!');
      }, [accounts, familyInfo, personalDataStore, familyDataStore, customRules, deletedTxIds]);

      const handleImportData = useCallback((importedJson) => {
        try {
          const parsed = typeof importedJson === 'string' ? JSON.parse(importedJson) : importedJson;
          if (!parsed || (!parsed.accounts && !parsed.personalDataStore)) {
            alert('File sao lưu không hợp lệ hoặc sai định dạng FinFlow!');
            return false;
          }

          if (parsed.accounts && Array.isArray(parsed.accounts)) {
            setAccounts(parsed.accounts);
            localStorage.setItem(STORAGE_KEY_ACCOUNTS, JSON.stringify(parsed.accounts));
          }
          if (parsed.familyInfo) {
            setFamilyInfo(parsed.familyInfo);
            localStorage.setItem(STORAGE_KEY_FAMILY_INFO, JSON.stringify(parsed.familyInfo));
          }
          if (parsed.personalDataStore) {
            setPersonalDataStore(parsed.personalDataStore);
            localStorage.setItem(STORAGE_KEY_PERSONAL_DATA, JSON.stringify(parsed.personalDataStore));
          }
          if (parsed.familyDataStore) {
            setFamilyDataStore(parsed.familyDataStore);
            localStorage.setItem(STORAGE_KEY_FAMILY_DATA, JSON.stringify(parsed.familyDataStore));
          }
          if (parsed.customRules) {
            setCustomRules(parsed.customRules);
            localStorage.setItem(STORAGE_KEY_CUSTOM_RULES, JSON.stringify(parsed.customRules));
          }
          if (parsed.deletedTxIds && Array.isArray(parsed.deletedTxIds)) {
            setDeletedTxIds(parsed.deletedTxIds);
            localStorage.setItem(STORAGE_KEY_DELETED_TXS, JSON.stringify(parsed.deletedTxIds));
          }

          // Đẩy ngay lên server trung tâm
          pushDataToServer({
            accounts: parsed.accounts || accounts,
            familyInfo: parsed.familyInfo || familyInfo,
            personalDataStore: parsed.personalDataStore || personalDataStore,
            familyDataStore: parsed.familyDataStore || familyDataStore,
            customRules: parsed.customRules || customRules,
            deletedTxIds: parsed.deletedTxIds || deletedTxIds,
            lastUpdatedBy: currentUser?.fullName || 'Khôi phục file',
            lastModified: Date.now()
          });

          showToast('✅ Khôi phục toàn bộ chi tiêu thành công!');
          return true;
        } catch (err) {
          alert('Lỗi khi đọc file: ' + err.message);
          return false;
        }
      }, [accounts, familyInfo, personalDataStore, familyDataStore, customRules, deletedTxIds, currentUser, pushDataToServer]);

      // Khởi tạo kết nối & lấy dữ liệu lần đầu
      useEffect(() => {
        // Lấy thông tin mạng (IP, Port, URL)
        fetch('/api/network')
          .then(r => r.json())
          .then(info => {
            if (info) {
              setNetworkInfo(info);
              if (info.connectedDevices) setConnectedDevicesCount(info.connectedDevices);
            }
          })
          .catch(() => {});

        // Lấy dữ liệu trung tâm
        fetch('/api/data')
          .then(r => r.json())
          .then(data => {
            if (data && data.accounts && Array.isArray(data.accounts)) {
              applyServerData(data);
            } else {
              pushDataToServer();
            }
            isInitialLoaded.current = true;
          })
          .catch(err => {
            console.warn('Initial server connect failed:', err);
            setSyncStatus('offline');
            isInitialLoaded.current = true;
          });
      }, []);

      // Lắng nghe sự kiện Realtime qua SSE (Server-Sent Events)
      useEffect(() => {
        let es = null;
        let retryTimer = null;

        function connectSSE() {
          try {
            es = new EventSource('/api/events');
            es.onopen = () => {
              setSyncStatus('connected');
            };
            es.onmessage = (e) => {
              try {
                const msg = JSON.parse(e.data);
                if (msg.type === 'connected') {
                  if (msg.clientsCount) setConnectedDevicesCount(msg.clientsCount);
                } else if (msg.type === 'sync_update') {
                  if (msg.senderId !== deviceId) {
                    fetch('/api/data')
                      .then(r => r.json())
                      .then(serverData => {
                        if (serverData && serverData.accounts) {
                          applyServerData(serverData);
                          showToast('⚡ Chi tiêu vừa được cập nhật từ thiết bị khác!');
                        }
                      })
                      .catch(() => {});
                  }
                }
              } catch (err) {}
            };
            es.onerror = () => {
              setSyncStatus('offline');
              if (es) es.close();
              retryTimer = setTimeout(connectSSE, 4000);
            };
          } catch (err) {
            setSyncStatus('offline');
          }
        }

        connectSSE();

        // Tự động kiểm tra đồng bộ khi chuyển tab hoặc mở sáng màn hình điện thoại
        const handleWakeup = () => {
          if (document.visibilityState === 'visible') {
            fetch('/api/data')
              .then(r => r.json())
              .then(serverData => {
                if (serverData && serverData.accounts) {
                  applyServerData(serverData);
                }
              })
              .catch(() => {});
          }
        };

        window.addEventListener('focus', handleWakeup);
        document.addEventListener('visibilitychange', handleWakeup);

        const pollInterval = setInterval(() => {
          if (document.visibilityState === 'visible') {
            handleWakeup();
          }
        }, 8000);

        return () => {
          if (es) es.close();
          if (retryTimer) clearTimeout(retryTimer);
          clearInterval(pollInterval);
          window.removeEventListener('focus', handleWakeup);
          document.removeEventListener('visibilitychange', handleWakeup);
        };
      }, [deviceId, applyServerData]);

      // Tự động đẩy dữ liệu lên máy chủ khi người dùng thay đổi dữ liệu trên thiết bị này
      useEffect(() => {
        if (!isInitialLoaded.current) return;
        if (isRemoteUpdate.current) return;

        if (pushTimeoutRef.current) clearTimeout(pushTimeoutRef.current);
        pushTimeoutRef.current = setTimeout(() => {
          pushDataToServer();
        }, 300);

        return () => {
          if (pushTimeoutRef.current) clearTimeout(pushTimeoutRef.current);
        };
      }, [accounts, familyInfo, personalDataStore, familyDataStore, customRules, pushDataToServer]);

      // 4. EFFECTS: PERSISTENCE
      useEffect(() => {
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        localStorage.setItem('finflow_dark', JSON.stringify(darkMode));
      }, [darkMode]);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY_ACCOUNTS, JSON.stringify(accounts));
      }, [accounts]);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY_CUSTOM_RULES, JSON.stringify(customRules));
      }, [customRules]);

      useEffect(() => {
        if (currentUserId) {
          localStorage.setItem(STORAGE_KEY_CURRENT_USER_ID, currentUserId);
        } else {
          localStorage.removeItem(STORAGE_KEY_CURRENT_USER_ID);
        }
      }, [currentUserId]);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY_PERSONAL_DATA, JSON.stringify(personalDataStore));
      }, [personalDataStore]);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY_FAMILY_DATA, JSON.stringify(familyDataStore));
      }, [familyDataStore]);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY_FAMILY_INFO, JSON.stringify(familyInfo));
      }, [familyInfo]);

      // Nâng cấp cấu trúc dữ liệu nếu chưa có monthlyBudgets mà KHÔNG làm mất giao dịch
      useEffect(() => {
        if (personalDataStore && !personalDataStore['usr-owner']?.monthlyBudgets) {
          setPersonalDataStore(prev => ({
            ...prev,
            'usr-owner': {
              ...(prev['usr-owner'] || {}),
              monthlyBudgets: INITIAL_PERSONAL_DATA['usr-owner']?.monthlyBudgets || {},
              transactions: prev['usr-owner']?.transactions || [],
            }
          }));
        }
        if (familyDataStore && !familyDataStore.monthlyBudgets) {
          setFamilyDataStore(prev => ({
            ...prev,
            monthlyBudgets: INITIAL_FAMILY_DATA?.monthlyBudgets || {},
            transactions: prev?.transactions || [],
          }));
        }
      }, []);

      // 5. CURRENT WORKSPACE DATA COMPUTATION
      // Kiểm tra người dùng có quyền vào Không gian Gia đình không
      const hasFamilyAccess = useMemo(() => {
        if (!currentUser) return false;
        return currentUser.isOwner || (currentUser.familyGroupId === familyInfo.id);
      }, [currentUser, familyInfo]);

      // Lấy dữ liệu theo workspace đang chọn
      const currentWorkspaceData = useMemo(() => {
        if (!currentUser) return null;

        if (activeWorkspace === 'family' && hasFamilyAccess) {
          return familyDataStore;
        }

        // Lấy dữ liệu cá nhân riêng biệt
        const userPData = personalDataStore[currentUser.id] || {
          monthlyIncome: 20000000,
          funds: DEFAULT_FUNDS,
          allocations: { f1: 55, f2: 10, f3: 10, f4: 10, f5: 10, f6: 5 },
          monthlyBudgets: {
            '2026-10': { monthlyIncome: 20000000, allocations: { f1: 55, f2: 10, f3: 10, f4: 10, f5: 10, f6: 5 } }
          },
          transactions: [],
        };
        return userPData;
      }, [activeWorkspace, hasFamilyAccess, currentUser, personalDataStore, familyDataStore]);

      // Cập nhật dữ liệu cho workspace hiện tại
      const updateCurrentWorkspaceData = (newData) => {
        if (activeWorkspace === 'family' && hasFamilyAccess) {
          setFamilyDataStore(prev => ({ ...prev, ...newData }));
        } else if (currentUser) {
          setPersonalDataStore(prev => ({
            ...prev,
            [currentUser.id]: {
              ...(prev[currentUser.id] || {}),
              ...newData,
            }
          }));
        }
      };

      // Ngân sách của tháng đang được chọn (selectedMonth)
      const currentMonthBudget = useMemo(() => {
        if (!currentWorkspaceData) {
          return { monthlyIncome: 20000000, allocations: { f1: 55, f2: 10, f3: 10, f4: 10, f5: 10, f6: 5 } };
        }
        const mbs = currentWorkspaceData.monthlyBudgets || {};
        if (mbs[selectedMonth]) {
          return {
            monthlyIncome: mbs[selectedMonth].monthlyIncome !== undefined ? mbs[selectedMonth].monthlyIncome : (currentWorkspaceData.monthlyIncome || 20000000),
            allocations: mbs[selectedMonth].allocations || currentWorkspaceData.allocations || { f1: 55, f2: 10, f3: 10, f4: 10, f5: 10, f6: 5 }
          };
        }
        return {
          monthlyIncome: currentWorkspaceData.monthlyIncome || 20000000,
          allocations: currentWorkspaceData.allocations || { f1: 55, f2: 10, f3: 10, f4: 10, f5: 10, f6: 5 }
        };
      }, [currentWorkspaceData, selectedMonth]);

      // Danh sách các tháng có dữ liệu
      const availableMonths = useMemo(() => {
        const curRealMonth = new Date().toISOString().slice(0, 7);
        const monthSet = new Set(['2026-08', '2026-09', '2026-10', curRealMonth]);
        if (selectedMonth) monthSet.add(selectedMonth);
        if (currentWorkspaceData?.monthlyBudgets) {
          Object.keys(currentWorkspaceData.monthlyBudgets).forEach(m => monthSet.add(m));
        }
        if (currentWorkspaceData?.transactions) {
          currentWorkspaceData.transactions.forEach(t => {
            if (t.date && t.date.length >= 7) monthSet.add(t.date.slice(0, 7));
          });
        }
        return Array.from(monthSet).sort().reverse();
      }, [currentWorkspaceData, selectedMonth]);

      // Giao dịch thuộc tháng đang chọn
      const monthTransactions = useMemo(() => {
        if (!currentWorkspaceData?.transactions) return [];
        return currentWorkspaceData.transactions.filter(t => t.date && t.date.startsWith(selectedMonth));
      }, [currentWorkspaceData, selectedMonth]);

      // 6. TÍNH TOÁN METRICS CHO THÁNG ĐANG CHỌN
      const fundStats = useMemo(() => {
        if (!currentWorkspaceData) return [];
        const funds = currentWorkspaceData.funds || DEFAULT_FUNDS;
        const { monthlyIncome, allocations } = currentMonthBudget;

        return funds.map(fund => {
          const pct = allocations[fund.id] || 0;
          const allocatedMoney = (monthlyIncome * pct) / 100;
          
          const spent = (monthTransactions || [])
            .filter(t => t.fundId === fund.id)
            .reduce((sum, t) => sum + t.amount, 0);

          const remaining = allocatedMoney - spent;
          const burnRate = allocatedMoney > 0 ? (spent / allocatedMoney) * 100 : 0;

          return {
            ...fund,
            pct,
            allocatedMoney,
            spent,
            remaining,
            burnRate: Math.round(burnRate),
            isOver: spent > allocatedMoney,
            isWarning: burnRate >= 80 && burnRate <= 100,
          };
        });
      }, [currentWorkspaceData, currentMonthBudget, monthTransactions]);

      const totalAllocated = useMemo(() => {
        return fundStats.reduce((acc, f) => acc + f.allocatedMoney, 0);
      }, [fundStats]);

      const totalSpent = useMemo(() => {
        return fundStats.reduce((acc, f) => acc + f.spent, 0);
      }, [fundStats]);

      const totalRemaining = totalAllocated - totalSpent;
      const overallBurnRate = totalAllocated > 0 ? Math.round((totalSpent / totalAllocated) * 100) : 0;

      // Lưu phân bổ quỹ cho một tháng riêng biệt
      const handleSaveMonthBudget = (monthKey, { monthlyIncome, allocations }) => {
        const existingMbs = currentWorkspaceData?.monthlyBudgets || {};
        const newMbs = {
          ...existingMbs,
          [monthKey]: { monthlyIncome, allocations }
        };
        updateCurrentWorkspaceData({
          monthlyBudgets: newMbs,
          ...(monthKey === selectedMonth ? { monthlyIncome, allocations } : {})
        });
        showToast(`Đã lưu kế hoạch phân bổ cho ${formatMonthDisplay(monthKey)}!`);
      };

      // Sao chép phân bổ quỹ từ tháng trước sang tháng đang chọn
      const handleCopyFromPreviousMonth = (targetMonth) => {
        const prevMonth = getPreviousMonth(targetMonth);
        const existingMbs = currentWorkspaceData?.monthlyBudgets || {};
        const prevBudget = existingMbs[prevMonth] || {
          monthlyIncome: currentWorkspaceData?.monthlyIncome || 20000000,
          allocations: currentWorkspaceData?.allocations || { f1: 55, f2: 10, f3: 10, f4: 10, f5: 10, f6: 5 }
        };
        handleSaveMonthBudget(targetMonth, {
          monthlyIncome: prevBudget.monthlyIncome,
          allocations: { ...prevBudget.allocations }
        });
        showToast(`Đã sao chép kế hoạch từ ${formatMonthDisplay(prevMonth)} sang ${formatMonthDisplay(targetMonth)}!`);
      };

      // Thêm quy tắc phân bổ tùy chỉnh mới
      const handleAddCustomRule = (newRule) => {
        const ruleObj = {
          ...newRule,
          id: 'rule-custom-' + Date.now(),
          isSystem: false,
        };
        setCustomRules(prev => [...prev, ruleObj]);
        showToast(`Đã lưu quy tắc phân bổ mới: "${ruleObj.name}"!`);
      };

      // Xóa quy tắc phân bổ tùy chỉnh
      const handleDeleteCustomRule = (ruleId) => {
        setCustomRules(prev => prev.filter(r => r.id !== ruleId));
        showToast('Đã xóa quy tắc tùy chỉnh!');
      };

      // 7. USER AUTH ACTIONS
      const handleLoginSuccess = (user) => {
        setCurrentUserId(user.id);
        setActiveWorkspace('personal'); // Mặc định vào Cá nhân
        showToast(`Đăng nhập thành công! Chào mừng ${user.fullName}`);
      };

      const handleLogout = () => {
        setCurrentUserId(null); // Xóa session!
        setIsUserMenuOpen(false);
        showToast('🔒 Đã đăng xuất! Bạn phải nhập mật khẩu để vào lại.');
      };

      // Tạo tài khoản mới
      const handleCreateAccount = (newAccData) => {
        const isFirst = accounts.length === 0;
        const newId = 'usr-' + Date.now();
        const newAccount = {
          id: newId,
          fullName: newAccData.fullName.trim(),
          email: newAccData.email.trim(),
          password: newAccData.password, // Mật khẩu bắt buộc!
          role: newAccData.role || (isFirst ? 'Chủ hộ' : 'Cá nhân'),
          isOwner: isFirst || newAccData.role === 'Chủ hộ',
          color: newAccData.color || '#10B981',
          familyGroupId: newAccData.inviteCode === familyInfo.inviteCode ? familyInfo.id : null,
          createdAt: new Date().toISOString().slice(0, 10),
        };

        const updated = [...accounts, newAccount];
        setAccounts(updated);

        // Khởi tạo vùng dữ liệu cá nhân riêng biệt 100% cho tài khoản này
        setPersonalDataStore(prev => ({
          ...prev,
          [newId]: {
            monthlyIncome: Number(newAccData.income) || 20000000,
            funds: DEFAULT_FUNDS,
            allocations: { f1: 55, f2: 10, f3: 10, f4: 10, f5: 10, f6: 5 },
            transactions: [],
          }
        }));

        setCurrentUserId(newId);
        showToast(`Đã tạo tài khoản riêng biệt cho ${newAccount.fullName}!`);
      };

      // XÓA THÀNH VIÊN (CHỈ DÀNH CHO TÀI KHOẢN CHỦ HỘ / OWNER)
      const handleDeleteMember = (targetAccount) => {
        if (!currentUser?.isOwner) {
          alert('Chỉ tài khoản Chủ Hộ mới có quyền xóa thành viên!');
          return;
        }
        if (targetAccount.id === currentUser.id) {
          alert('Bạn không thể tự xóa chính tài khoản chủ hộ của mình!');
          return;
        }

        const confirmMsg = `CẢNH BÁO BẢO MẬT:\nBạn có chắc chắn muốn xóa thành viên "${targetAccount.fullName}" khỏi hệ thống không? Toàn bộ quyền truy cập gia đình của người này sẽ bị thu hồi.`;
        if (window.confirm(confirmMsg)) {
          const updated = accounts.filter(a => a.id !== targetAccount.id);
          setAccounts(updated);
          showToast(`Chủ hộ đã xóa thành công thành viên: ${targetAccount.fullName}`);
        }
      };

      // ĐỔI MẬT KHẨU (CHỈ DÀNH CHO CÁ NHÂN ĐANG ĐĂNG NHẬP)
      const handleChangePassword = (newPassword) => {
        if (!currentUser) return;
        const updated = accounts.map(a =>
          a.id === currentUser.id ? { ...a, password: newPassword } : a
        );
        setAccounts(updated);
        setIsChangePasswordModalOpen(false);
        showToast('🔑 Đổi mật khẩu thành công! Mật khẩu mới đã được kích hoạt.');
      };

      // THAM GIA KHÔNG GIAN GIA ĐÌNH BẰNG MÃ MỜI
      const handleJoinFamilyByCode = (code) => {
        if (code.trim().toUpperCase() === familyInfo.inviteCode.toUpperCase()) {
          const updatedAccounts = accounts.map(a =>
            a.id === currentUser.id ? { ...a, familyGroupId: familyInfo.id, role: 'Thành viên' } : a
          );
          setAccounts(updatedAccounts);
          setIsJoinFamilyModalOpen(false);
          setActiveWorkspace('family');
          showToast('Xác thực thành công! Bạn đã được thêm vào Không Gian Gia Đình.');
        } else {
          alert('Mã mời không chính xác! Hãy xin mã mời từ Chủ Hộ (ví dụ: ' + familyInfo.inviteCode + ')');
        }
      };

      // THÊM GIAO DỊCH MỚI
      const handleAddTransaction = (tx) => {
        const currentTxs = currentWorkspaceData?.transactions || [];
        const updatedTxs = [tx, ...currentTxs];
        updateCurrentWorkspaceData({ transactions: updatedTxs });

        // Tự động chuyển selectedMonth sang tháng của giao dịch vừa thêm để người dùng nhìn thấy ngay
        if (tx && tx.date) {
          const txMonth = tx.date.slice(0, 7);
          if (txMonth && txMonth !== selectedMonth) {
            setSelectedMonth(txMonth);
          }
        }

        setIsAddModalOpen(false);
        showToast(`Đã ghi nhận chi tiêu ${formatVND(tx.amount)}!`);
      };

      // XÓA GIAO DỊCH
      const handleDeleteTransaction = (txId) => {
        const currentTxs = currentWorkspaceData?.transactions || [];
        const updatedTxs = currentTxs.filter(t => t.id !== txId);
        updateCurrentWorkspaceData({ transactions: updatedTxs });

        // Đánh dấu tombstone để vĩnh viễn không bị server cũ hoặc thiết bị khác phục hồi lại
        setDeletedTxIds(prev => {
          const next = Array.from(new Set([...prev, txId]));
          try { localStorage.setItem(STORAGE_KEY_DELETED_TXS, JSON.stringify(next)); } catch (e) {}
          return next;
        });

        showToast('Đã xóa giao dịch thành công!');
      };

      // ==========================================
      // NẾU CHƯA ĐĂNG NHẬP -> HIỂN THỊ MÀN HÌNH BẢO MẬT & BẮT BUỘC MẬT KHẨU
      // ==========================================
      if (!currentUser) {
        return (
          <>
            <AuthScreen
              accounts={accounts}
              onLoginSuccess={handleLoginSuccess}
              onCreateAccount={handleCreateAccount}
              familyInviteCode={familyInfo.inviteCode}
              darkMode={darkMode}
              setDarkMode={setDarkMode}
              syncStatus={syncStatus}
              connectedDevicesCount={connectedDevicesCount}
              onOpenSyncModal={() => setIsMobileQRModalOpen(true)}
            />
            {isMobileQRModalOpen && (
              <MobileQRModal
                onClose={() => setIsMobileQRModalOpen(false)}
                syncStatus={syncStatus}
                connectedDevicesCount={connectedDevicesCount}
                lastSyncTime={lastSyncTime}
                onForceSync={handleForceSync}
                networkInfo={networkInfo}
                onExportData={handleExportData}
                onImportData={handleImportData}
              />
            )}
          </>
        );
      }

      return (
        <div className="flex flex-col min-h-screen">
          {/* TOAST */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3 rounded-2xl bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 shadow-2xl border border-zinc-700 dark:border-zinc-300 animate-fadeIn">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
              <span className="text-sm font-semibold">{toastMessage}</span>
            </div>
          )}

          {/* TOP NAVBAR */}
          <header className="sticky top-0 z-40 w-full border-b border-zinc-200 dark:border-zinc-800 glassmorphism">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              {/* Logo & Workspace Switcher */}
              <div className="flex items-center gap-4">
                <div className="flex items-center gap-2 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                  </div>
                  <div className="hidden sm:block">
                    <span className="text-xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-600 to-teal-500 bg-clip-text text-transparent">FinFlow</span>
                    <span className="text-[10px] uppercase font-bold tracking-widest text-zinc-400 block -mt-1">Isolated & Secure Cashflow</span>
                  </div>
                </div>

                {/* WORKSPACE SWITCHER: CÁ NHÂN ĐỘC LẬP vs GIA ĐÌNH BẢO MẬT */}
                <div className="flex items-center p-1 bg-zinc-200/70 dark:bg-zinc-800/70 rounded-2xl text-xs font-semibold">
                  <button
                    onClick={() => {
                      setActiveWorkspace('personal');
                      showToast(`Chuyển sang Quản lý Cá nhân riêng biệt: ${currentUser.fullName}`);
                    }}
                    className={`px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 ${
                      activeWorkspace === 'personal'
                        ? 'bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-50 shadow-sm font-bold'
                        : 'text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100'
                    }`}
                  >
                    <span>👤</span> Cá Nhân ({currentUser.fullName.split(' ').slice(-1)[0]})
                  </button>

                  <button
                    onClick={() => {
                      if (!hasFamilyAccess) {
                        setIsJoinFamilyModalOpen(true);
                      } else {
                        setActiveWorkspace('family');
                        showToast('Chuyển sang Không gian Chung Gia Đình');
                      }
                    }}
                    className={`px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 ${
                      activeWorkspace === 'family'
                        ? 'bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-50 shadow-sm font-bold'
                        : 'text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100'
                    }`}
                  >
                    <span>👨‍👩‍👧</span> Gia Đình
                    {!hasFamilyAccess && <span className="text-[10px] text-amber-500 font-bold ml-0.5">🔒</span>}
                  </button>
                </div>
              </div>

              {/* Action Buttons: Mobile QR, Quick Add, Dark Mode, Profile */}
              <div className="flex items-center gap-2 sm:gap-3">
                {/* NÚT ĐỒNG BỘ REALTIME & MỞ TRÊN ĐIỆN THOẠI / LINK ONLINE */}
                <button
                  onClick={() => setIsMobileQRModalOpen(true)}
                  className={`px-2.5 sm:px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-2 border transition shadow-sm ${
                    syncStatus === 'connected'
                      ? 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-100 dark:hover:bg-emerald-900/60 border-emerald-200 dark:border-emerald-800/80'
                      : syncStatus === 'syncing'
                      ? 'bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300 hover:bg-blue-100 border-blue-200'
                      : 'bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 hover:bg-amber-100 border-amber-200'
                  }`}
                  title="Xem trạng thái đồng bộ thời gian thực & Link online đa thiết bị"
                >
                  <span className="relative flex h-2.5 w-2.5">
                    {syncStatus === 'connected' && (
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    )}
                    <span className={`relative inline-flex rounded-full h-2.5 w-2.5 ${
                      syncStatus === 'connected' ? 'bg-emerald-500' : syncStatus === 'syncing' ? 'bg-blue-500 animate-spin' : 'bg-amber-500'
                    }`}></span>
                  </span>
                  <span className="hidden sm:inline font-bold">
                    {syncStatus === 'connected' ? 'Đồng Bộ Live' : syncStatus === 'syncing' ? 'Đang Lưu...' : 'Ngoại Tuyến'}
                  </span>
                  <span className="sm:hidden font-bold">
                    {syncStatus === 'connected' ? 'Live' : 'Sync'}
                  </span>
                  {connectedDevicesCount > 1 && (
                    <span className="text-[10px] px-1.5 py-0.2 rounded-full bg-emerald-200/80 dark:bg-emerald-900 text-emerald-800 dark:text-emerald-200 font-extrabold hidden md:inline">
                      {connectedDevicesCount} máy
                    </span>
                  )}
                </button>

                <button
                  onClick={() => setIsAddModalOpen(true)}
                  className="px-3 sm:px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold text-xs sm:text-sm flex items-center gap-1.5 shadow-lg shadow-emerald-600/25 transition"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4" />
                  </svg>
                  <span className="hidden xs:inline sm:inline">Ghi Chép</span>
                </button>

                {/* Dark Mode */}
                <button
                  onClick={() => setDarkMode(!darkMode)}
                  className="p-2.5 rounded-xl bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition"
                  title="Chuyển đổi giao diện sáng/tối"
                >
                  {darkMode ? (
                    <svg className="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
                      <path fillRule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clipRule="evenodd"/>
                    </svg>
                  ) : (
                    <svg className="w-4 h-4 text-zinc-600" fill="currentColor" viewBox="0 0 20 20">
                      <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
                    </svg>
                  )}
                </button>

                {/* USER PROFILE & LOGOUT TRIGGER */}
                <div className="relative">
                  <button
                    onClick={() => setIsUserMenuOpen(!isUserMenuOpen)}
                    className="flex items-center gap-2 p-1.5 rounded-2xl hover:bg-zinc-100 dark:hover:bg-zinc-800 transition"
                  >
                    <div
                      className="w-9 h-9 rounded-xl flex items-center justify-center text-white font-black text-xs ring-2 ring-white dark:ring-zinc-900 shadow"
                      style={{ backgroundColor: currentUser.color || '#10B981' }}
                    >
                      {getInitials(currentUser.fullName)}
                    </div>
                    <div className="hidden md:block text-left pr-1">
                      <p className="text-xs font-bold leading-tight text-zinc-900 dark:text-zinc-100 flex items-center gap-1">
                        {currentUser.fullName}
                        {currentUser.isOwner && <span className="text-[10px] text-amber-500 font-extrabold" title="Tài khoản chủ hộ">👑</span>}
                      </p>

    // ==========================================

    function AuthScreen({ accounts, onLoginSuccess, onCreateAccount, familyInviteCode, darkMode, setDarkMode, syncStatus, connectedDevicesCount, onOpenSyncModal }) {
      const [authTab, setAuthTab] = useState('login'); // 'login' | 'register'
      
      // Đăng nhập state
      const [selectedAccount, setSelectedAccount] = useState(accounts[0] || null);
      const [password, setPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      // Form tạo tài khoản mới
      const [fullName, setFullName] = useState('');
      const [email, setEmail] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [regIncome, setRegIncome] = useState(25000000);
      const [role, setRole] = useState(accounts.length === 0 ? 'Chủ hộ' : 'Cá nhân');
      const [inviteCodeInput, setInviteCodeInput] = useState('');
      const [color, setColor] = useState('#10B981');

      const COLORS = ['#10B981', '#3B82F6', '#8B5CF6', '#F59E0B', '#EC4899', '#06B6D4'];

      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');

        if (!selectedAccount) {
          setLoginError('Vui lòng chọn tài khoản muốn đăng nhập.');
          return;
        }

        // BẮT BUỘC KIỂM TRA MẬT KHẨU CHÍNH XÁC!
        if (selectedAccount.password !== password) {
          setLoginError('Mật khẩu không chính xác! Vui lòng thử lại.');
          return;
        }

        onLoginSuccess(selectedAccount);
      };

      const handleRegister = (e) => {
        e.preventDefault();
        if (!fullName.trim()) {
          alert('Vui lòng nhập Họ và Tên.');
          return;
        }
        if (!regPassword) {
          alert('Vui lòng nhập Mật khẩu để bảo mật tài khoản.');
          return;
        }

        onCreateAccount({
          fullName: fullName.trim(),
          email: email.trim() || `${fullName.toLowerCase().replace(/\s+/g, '')}@finflow.app`,
          password: regPassword,
          income: regIncome,
          role,
          inviteCode: inviteCodeInput.trim(),
          color,
        });
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-zinc-100 dark:bg-zinc-950 relative overflow-hidden">

                <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                </svg>

                    }`}
                    title="Nhấp để quét mã QR mở trên điện thoại hoặc lấy Link online"

                    <span className="relative flex h-2 w-2">
                      {syncStatus === 'connected' && (
                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>

                    </span>
                    <span>{syncStatus === 'connected' ? 'Đồng bộ Live Realtime' : 'Máy chủ sẵn sàng'}</span>

            {authTab === 'register' && (

                    <input
                      type="password"
                      required
                      placeholder="Đặt mật khẩu"

                      onChange={(e) => setRegPassword(e.target.value)}
