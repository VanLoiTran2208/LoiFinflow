    // 2. BUDGET ALLOCATION VIEW
    // ==========================================
    function BudgetAllocationView({
      selectedMonth,
      setSelectedMonth,
      availableMonths = [],
      monthBudget,
      onSaveMonthBudget,
      onCopyFromPreviousMonth,
      funds,
      customRules = [],
      onAddCustomRule,
      onDeleteCustomRule,
      activeWorkspace,
      onSaved,
    }) {
      const [income, setIncome] = useState(monthBudget?.monthlyIncome || 0);
      const [allocations, setAllocations] = useState(monthBudget?.allocations || {});
      const [isCreateRuleModalOpen, setIsCreateRuleModalOpen] = useState(false);
      const [newRuleName, setNewRuleName] = useState('');
      const [newRuleDesc, setNewRuleDesc] = useState('');

      // Đồng bộ khi đổi tháng hoặc nhận prop mới
      useEffect(() => {
        if (monthBudget) {
          setIncome(monthBudget.monthlyIncome || 0);
          setAllocations(monthBudget.allocations || {});
        }
      }, [selectedMonth, monthBudget]);

      const currentTotalPct = useMemo(() => {
        return Object.values(allocations).reduce((acc, val) => acc + (Number(val) || 0), 0);
      }, [allocations]);

      const isValid = currentTotalPct === 100;

      const handlePctChange = (fundId, newPct) => {
        const val = Math.max(0, Math.min(100, Number(newPct) || 0));
        setAllocations(prev => ({ ...prev, [fundId]: val }));
      };

      const handleApplyPreset = (values) => {
        setAllocations({ ...values });
      };

      const handleSave = () => {
        if (!isValid || income <= 0) return;
        onSaveMonthBudget(selectedMonth, { monthlyIncome: income, allocations });
        if (onSaved) onSaved();
      };

      const handleCreateRuleSubmit = (e) => {
        e.preventDefault();
        if (!newRuleName.trim()) {
          alert('Vui lòng nhập tên quy tắc!');
          return;
        }
        if (!isValid) {
          alert('Tổng tỷ lệ của các hũ phải đạt đúng 100% trước khi lưu quy tắc!');
          return;
        }

        onAddCustomRule({
          name: newRuleName.trim(),
          desc: newRuleDesc.trim() || `Tỷ lệ: ${funds.map(f => `${f.name.split(' ')[0]} ${allocations[f.id] || 0}%`).join(', ')}`,
          values: { ...allocations }
        });

        setNewRuleName('');
        setNewRuleDesc('');
        setIsCreateRuleModalOpen(false);
      };

      const allRules = useMemo(() => {
        return [...DEFAULT_PRESETS, ...customRules];
      }, [customRules]);

      const prevMonthStr = getPreviousMonth(selectedMonth);

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="p-6 md:p-8 rounded-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-xl space-y-6">
            {/* TIÊU ĐỀ & THANH ĐIỀU HƯỚNG THÁNG RIÊNG BIỆT */}
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-zinc-100 dark:border-zinc-800">
              <div>
                <span className="text-[11px] font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/60 px-2.5 py-1 rounded-full">
                  📅 Phân Bổ Ngân Sách Độc Lập Từng Tháng
                </span>
                <h2 className="text-2xl font-black text-zinc-900 dark:text-zinc-50 tracking-tight mt-1.5">
                  Kế Hoạch Cho {formatMonthDisplay(selectedMonth)} ({activeWorkspace === 'personal' ? 'Cá Nhân' : 'Gia Đình'})
                </h2>
                <p className="text-xs text-zinc-500 dark:text-zinc-400 mt-1">
                  Mỗi tháng có thu nhập và tỷ lệ phân bổ quỹ riêng biệt, không bị ghi đè lên các tháng khác.
                </p>
              </div>

              {/* BỘ CHỌN THÁNG & SAO CHÉP TỪ THÁNG TRƯỚC */}
              <div className="flex flex-wrap items-center gap-2 self-start md:self-auto">
                <div className="flex items-center bg-zinc-100 dark:bg-zinc-800 p-1 rounded-2xl text-xs font-bold border border-zinc-200 dark:border-zinc-700">
                  <button
                    type="button"
                    onClick={() => setSelectedMonth(getPreviousMonth(selectedMonth))}
                    className="px-2.5 py-1.5 hover:bg-white dark:hover:bg-zinc-700 rounded-xl text-zinc-600 dark:text-zinc-300 transition"
                    title="Tháng trước"
                  >
                    ◀
                  </button>
                  <select
                    value={selectedMonth}
                    onChange={(e) => setSelectedMonth(e.target.value)}
                    className="bg-transparent text-zinc-900 dark:text-zinc-100 font-bold px-2 py-1 outline-none cursor-pointer text-xs"
                  >
                    {availableMonths.map(m => (
                      <option key={m} value={m} className="bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100">
                        {formatMonthDisplay(m)} {m === '2026-10' ? '(Hiện tại)' : ''}
                      </option>
                    ))}
                  </select>
                  <button
                    type="button"
                    onClick={() => setSelectedMonth(getNextMonth(selectedMonth))}
                    className="px-2.5 py-1.5 hover:bg-white dark:hover:bg-zinc-700 rounded-xl text-zinc-600 dark:text-zinc-300 transition"
                    title="Tháng sau"
                  >
                    ▶
                  </button>
                </div>

                <button
                  type="button"
                  onClick={() => onCopyFromPreviousMonth(selectedMonth)}
                  className="px-3.5 py-2 rounded-2xl bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-xs font-bold text-zinc-700 dark:text-zinc-200 transition flex items-center gap-1.5 border border-zinc-200 dark:border-zinc-700"
                  title={`Sao chép ngân sách từ ${formatMonthDisplay(prevMonthStr)} sang ${formatMonthDisplay(selectedMonth)}`}
                >
                  <span>📋</span>
                  <span>Sao Chép Từ {formatMonthDisplay(prevMonthStr).replace('Tháng ', 'T')}</span>
                </button>
              </div>
            </div>

            {/* PHẦN QUY TẮC PHÂN BỔ (DEFAULT PRESETS + CUSTOM RULES) */}
            <div className="p-4 rounded-2xl bg-zinc-50 dark:bg-zinc-850 border border-zinc-200/80 dark:border-zinc-800">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                <div className="flex items-center gap-2">
                  <span className="text-base">📐</span>
                  <h3 className="text-xs font-bold uppercase tracking-wider text-zinc-700 dark:text-zinc-300">
                    Quy Tắc Phân Bổ Ngân Sách ({allRules.length} Quy Tắc)
                  </h3>
                </div>
                <button
                  type="button"
                  onClick={() => setIsCreateRuleModalOpen(true)}
                  className="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition flex items-center gap-1.5 shadow-sm self-start sm:self-auto"
                >
                  <span>+</span> Lưu Tỷ Lệ Hiện Tại Thành Quy Tắc Mới
                </button>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
                {allRules.map(rule => (
                  <div
                    key={rule.id}
                    className="p-3 rounded-xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 flex flex-col justify-between hover:border-emerald-500 dark:hover:border-emerald-500 transition group"
                  >
                    <div>
                      <div className="flex items-center justify-between gap-1 mb-1">
                        <span className="text-xs font-extrabold text-zinc-900 dark:text-zinc-100 truncate">
                          {rule.name}
                        </span>
                        {rule.isSystem ? (
                          <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-zinc-100 text-zinc-600 dark:bg-zinc-800 dark:text-zinc-400">
                            Chuẩn
                          </span>
                        ) : (
                          <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-400">
                            Tự tạo
                          </span>
                        )}
                      </div>
                      <p className="text-[11px] text-zinc-400 line-clamp-2 mb-2 leading-relaxed">
                        {rule.desc}
                      </p>
                    </div>

                    <div className="flex items-center justify-between pt-1 border-t border-zinc-100 dark:border-zinc-800 mt-1">
                      <button
                        type="button"
                        onClick={() => handleApplyPreset(rule.values)}
                        className="text-[11px] font-bold text-emerald-600 dark:text-emerald-400 hover:underline flex items-center gap-1"
                      >
                        <span>⚡</span> Áp dụng cho {formatMonthDisplay(selectedMonth)}
                      </button>
                      {!rule.isSystem && (
                        <button
                          type="button"
                          onClick={() => onDeleteCustomRule(rule.id)}
                          className="text-zinc-400 hover:text-rose-500 transition text-xs p-1"
                          title="Xóa quy tắc tùy chỉnh này"
                        >
                          🗑️
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Thu Nhập Input Cho Tháng Đang Chọn */}
            <div className="p-5 rounded-2xl bg-zinc-50 dark:bg-zinc-800/40 border border-zinc-200/60 dark:border-zinc-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <label className="text-xs font-bold uppercase tracking-wider text-zinc-500">
                  Tổng Thu Nhập {formatMonthDisplay(selectedMonth)} ({activeWorkspace === 'personal' ? 'Cá Nhân' : 'Quỹ Gia Đình'})
                </label>
                <div className="mt-1.5 flex items-center gap-2">
                  <input
                    type="number"
                    step="500000"
                    value={income}
                    onChange={(e) => setIncome(Number(e.target.value) || 0)}
                    className="w-full sm:w-64 text-xl font-black bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-2 text-zinc-900 dark:text-zinc-100 focus:ring-2 focus:ring-emerald-500 outline-none"
                  />
                </div>
              </div>
              <div className="sm:text-right">
                <span className="text-xs text-zinc-400 font-medium">Bằng chữ</span>
                <p className="text-2xl font-black text-emerald-600 dark:text-emerald-400">{formatVND(income)}</p>
              </div>
            </div>

            {/* Validation & Total Progress */}
            <div>
              <div className="flex justify-between items-center text-sm font-bold mb-2">
                <span>Tổng tỷ lệ: {currentTotalPct}% / 100%</span>
                <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold ${
                  isValid ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-400' : 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-400'
                }`}>
                  {isValid ? 'Chuẩn 100%' : currentTotalPct > 100 ? `Vượt ${currentTotalPct - 100}%` : `Còn thiếu ${100 - currentTotalPct}%`}
                </span>
              </div>

              <div className="w-full h-3.5 bg-zinc-200 dark:bg-zinc-800 rounded-full overflow-hidden flex">
                {funds.map(f => {
                  const pct = allocations[f.id] || 0;
                  if (pct <= 0) return null;
                  return (
                    <div
                      key={f.id}
                      style={{ width: `${pct}%`, backgroundColor: f.color }}
                      className="h-full transition-all duration-300"
                      title={`${f.name}: ${pct}%`}
                    />
                  );
                })}
              </div>
            </div>

            {/* Danh sách từng hũ quỹ */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {funds.map(fund => {
                const pct = allocations[fund.id] || 0;
                const calcAmount = (income * pct) / 100;
                return (
                  <div key={fund.id} className="p-4 rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/60 shadow-sm">
                    <div className="flex justify-between items-center mb-2">
                      <div className="flex items-center gap-2">
                        <div className="w-3.5 h-3.5 rounded-full" style={{ backgroundColor: fund.color }}></div>
                        <span className="font-bold text-sm text-zinc-900 dark:text-zinc-100">{fund.name}</span>
                      </div>
                      <div className="flex items-center gap-1">
                        <input
                          type="number"
                          min="0"
                          max="100"
                          value={pct}
                          onChange={(e) => handlePctChange(fund.id, e.target.value)}
                          className="w-16 text-right font-black text-sm bg-zinc-100 dark:bg-zinc-800 rounded-lg px-2 py-1 outline-none focus:ring-2 focus:ring-emerald-500"
                        />
                        <span className="text-zinc-400 text-xs font-bold">%</span>
                      </div>
                    </div>

                    <input
                      type="range"
                      min="0"
                      max="100"
                      value={pct}
                      onChange={(e) => handlePctChange(fund.id, e.target.value)}
                      style={{ accentColor: fund.color }}
                      className="w-full cursor-pointer h-1.5 rounded-lg bg-zinc-200 dark:bg-zinc-700"
                    />

                    <div className="mt-2 flex justify-between items-center text-xs">
                      <span className="text-zinc-400">Số tiền được cấp ({formatMonthDisplay(selectedMonth)}):</span>
                      <span className="font-bold text-zinc-800 dark:text-zinc-200">{formatVND(calcAmount)}</span>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* NÚT LƯU KẾ HOẠCH CHO THÁNG NÀY */}
            <div className="pt-6 border-t border-zinc-100 dark:border-zinc-800 flex flex-col sm:flex-row items-center justify-between gap-4">
              <span className="text-xs text-zinc-400">
                Kế hoạch này sẽ áp dụng riêng cho <strong>{formatMonthDisplay(selectedMonth)}</strong>.
              </span>
              <button
                disabled={!isValid || income <= 0}
                onClick={handleSave}
                className={`w-full sm:w-auto px-8 py-3.5 rounded-2xl font-bold text-sm transition shadow-lg flex items-center justify-center gap-2 ${
                  isValid && income > 0
                    ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-500/25 active:scale-95 cursor-pointer'
                    : 'bg-zinc-200 text-zinc-400 dark:bg-zinc-800 dark:text-zinc-600 cursor-not-allowed'
                }`}
              >
                <span>🔒</span> Khóa & Kích Hoạt Kế Hoạch {formatMonthDisplay(selectedMonth)}
              </button>
            </div>
          </div>

          {/* MODAL: LƯU TỶ LỆ HIỆN TẠI THÀNH QUY TẮC MỚI */}
          {isCreateRuleModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-white dark:bg-zinc-900 rounded-3xl p-6 sm:p-7 shadow-2xl border border-zinc-200 dark:border-zinc-800 relative animate-fadeIn">
                <button
                  onClick={() => setIsCreateRuleModalOpen(false)}
                  className="absolute top-5 right-5 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 font-bold text-lg w-8 h-8 rounded-full bg-zinc-100 dark:bg-zinc-800 flex items-center justify-center transition"
                >
                  ✕
                </button>

                <div className="text-center mb-5">
                  <div className="w-12 h-12 rounded-2xl bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-2xl mx-auto mb-2">
                    📐
                  </div>
                  <h3 className="text-lg font-black text-zinc-900 dark:text-zinc-50 tracking-tight">
                    Tạo Quy Tắc Phân Bổ Mới
                  </h3>
                  <p className="text-xs text-zinc-400 mt-1">
                    Lưu công thức phân bổ hiện tại để tái sử dụng nhanh chóng cho bất kỳ tháng nào.
                  </p>
                </div>

                {/* Xem trước tỷ lệ các hũ */}
                <div className="mb-4 p-3.5 rounded-2xl bg-zinc-50 dark:bg-zinc-800/60 border border-zinc-200/80 dark:border-zinc-800">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-zinc-400 block mb-2">
                    Tỷ lệ sẽ lưu ({currentTotalPct}%):
                  </span>
                  <div className="grid grid-cols-3 gap-2">
                    {funds.map(f => (
                      <div key={f.id} className="text-center p-1.5 rounded-lg bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700">
                        <span className="text-[10px] text-zinc-400 block truncate">{f.name.split(' ')[0]}</span>
                        <span className="text-xs font-black text-zinc-900 dark:text-zinc-100" style={{ color: f.color }}>
                          {allocations[f.id] || 0}%
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                <form onSubmit={handleCreateRuleSubmit} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold uppercase tracking-wider text-zinc-500 block mb-1">
                      Tên Quy Tắc *
                    </label>
                    <input
                      type="text"
                      required
                      autoFocus
                      placeholder="Ví dụ: Quy tắc Tháng Thưởng Tết, Tích Lũy Mua Xe..."
                      value={newRuleName}
                      onChange={(e) => setNewRuleName(e.target.value)}
                      className="w-full bg-zinc-50 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-2.5 text-xs font-bold outline-none focus:ring-2 focus:ring-emerald-500 text-zinc-900 dark:text-zinc-100"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold uppercase tracking-wider text-zinc-500 block mb-1">
                      Mô Tả / Mục Đích (Tùy chọn)
                    </label>
                    <input
                      type="text"
                      placeholder="Ví dụ: Dành cho những tháng có thưởng hoặc nhiều đám cưới"
                      value={newRuleDesc}
                      onChange={(e) => setNewRuleDesc(e.target.value)}
                      className="w-full bg-zinc-50 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-2.5 text-xs font-semibold outline-none focus:ring-2 focus:ring-emerald-500 text-zinc-900 dark:text-zinc-100"
                    />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsCreateRuleModalOpen(false)}
                      className="flex-1 py-3 rounded-xl bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-300 text-xs font-bold transition"
                    >
                      Hủy
                    </button>
                    <button
                      type="submit"
                      disabled={!isValid}
                      className="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs font-bold shadow-lg shadow-emerald-500/25 transition disabled:opacity-50"
                    >
                      Lưu Quy Tắc Này
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3. TRANSACTIONS VIEW
    // ==========================================
    function TransactionsView({
      funds,
      transactions,
      selectedMonth,
      setSelectedMonth,
      availableMonths = [],
      onDeleteTransaction,
      onOpenAddModal,
      onViewReceipt,
      activeWorkspace,
    }) {
      const [filterMonth, setFilterMonth] = useState('all');
      const [filterFund, setFilterFund] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      const filtered = useMemo(() => {
        return transactions.filter(t => {
          const matchMonth = filterMonth === 'all' || (t.date && t.date.startsWith(filterMonth));
          const matchFund = filterFund === 'all' || t.fundId === filterFund;
          const matchQuery = t.note.toLowerCase().includes(searchQuery.toLowerCase()) || (t.userName && t.userName.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchMonth && matchFund && matchQuery;
        });
      }, [transactions, filterMonth, filterFund, searchQuery]);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-6 rounded-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-sm">
            <div>
              <h2 className="text-2xl font-black text-zinc-900 dark:text-zinc-50 tracking-tight">Sổ Ghi Chép Chi Tiêu</h2>
              <p className="text-xs text-zinc-400 mt-1">
                {activeWorkspace === 'personal'
                  ? 'Sổ chi tiêu cá nhân độc lập của riêng bạn'
                  : 'Sổ chi tiêu chung của Không gian Gia Đình'}
              </p>
            </div>
            <button
              onClick={onOpenAddModal}
              className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-md shadow-emerald-500/20 transition flex items-center gap-2 self-start sm:self-auto"
            >
              <span>+</span> Thêm Giao Dịch
            </button>
          </div>

          {/* Search & Filter Bar: Tìm kiếm, Lọc tháng, Lọc quỹ */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <input
              type="text"
              placeholder="🔍 Tìm kiếm giao dịch, người chi, ghi chú..."
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl px-4 py-2.5 text-xs sm:text-sm outline-none focus:ring-2 focus:ring-emerald-500"
            />
            <select
              value={filterMonth}
              onChange={(e) => setFilterMonth(e.target.value)}
              className="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl px-4 py-2.5 text-xs sm:text-sm font-semibold outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer"
            >
              <option value="all">📅 Tất cả các tháng</option>
              {availableMonths.map(m => (
                <option key={m} value={m}>{formatMonthDisplay(m)} {m === '2026-10' ? '(Hiện tại)' : ''}</option>
              ))}
            </select>
            <select
              value={filterFund}
              onChange={(e) => setFilterFund(e.target.value)}
              className="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl px-4 py-2.5 text-xs sm:text-sm font-semibold outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer"
            >
              <option value="all">🎯 Tất cả các quỹ</option>
              {funds.map(f => (
                <option key={f.id} value={f.id}>{f.name}</option>
              ))}
            </select>
          </div>

          {/* Mobile Card List (<md screens) */}
          <div className="block md:hidden space-y-3">
            {filtered.length === 0 ? (
              <div className="p-8 text-center text-zinc-400 text-xs bg-white dark:bg-zinc-900 rounded-3xl border border-zinc-200 dark:border-zinc-800">
                Chưa có giao dịch nào trong sổ này.
              </div>
            ) : (
              filtered.map(tx => {
                const fund = funds.find(f => f.id === tx.fundId);
                return (
                  <div key={tx.id} className="p-4 rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-sm space-y-3">
                    <div className="flex items-start justify-between gap-2">
                      <div className="space-y-1">
                        <p className="font-bold text-sm text-zinc-900 dark:text-zinc-100">{tx.note}</p>
                        <div className="flex items-center gap-2 text-[11px] text-zinc-400">
                          <span>{tx.date}</span>
                          <span>•</span>
                          <span className="font-semibold text-zinc-600 dark:text-zinc-300">👤 {tx.userName}</span>
                        </div>
                      </div>
                      <span className="font-black text-sm text-rose-600 dark:text-rose-400 whitespace-nowrap">
                        -{formatVND(tx.amount)}
                      </span>
                    </div>

                    <div className="flex items-center justify-between pt-2 border-t border-zinc-100 dark:border-zinc-800 text-xs">
                      <span
                        className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold"
                        style={{ backgroundColor: `${fund?.color || '#10b981'}15`, color: fund?.color || '#10b981' }}
                      >
                        <span className="w-2 h-2 rounded-full" style={{ backgroundColor: fund?.color || '#10b981' }}></span>
                        {fund?.name || 'Chung'}
                      </span>

                      <div className="flex items-center gap-2">
                        {tx.receiptUrl && (
                          <button
                            onClick={() => onViewReceipt(tx.receiptUrl)}
                            className="text-xs font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/50 px-2 py-1 rounded-lg flex items-center gap-1"
                          >
                            <span>🧾</span> Xem hóa đơn
                          </button>
                        )}
                        <button
                          onClick={() => onDeleteTransaction(tx.id)}
                          className="text-xs text-rose-500 font-bold p-1 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/40"
                          title="Xóa giao dịch"
                        >
                          🗑️
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </div>

          {/* Desktop Table (>=md screens) */}
          <div className="hidden md:block rounded-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm">
                <thead className="bg-zinc-50 dark:bg-zinc-800/50 text-xs uppercase font-bold text-zinc-400 border-b border-zinc-100 dark:border-zinc-800">
                  <tr>
                    <th className="px-6 py-4">Ngày</th>
                    <th className="px-6 py-4">Nội Dung Chi Tiêu</th>
                    <th className="px-6 py-4">Quỹ Phân Bổ</th>
                    <th className="px-6 py-4">Người Chi</th>
                    <th className="px-6 py-4">Hóa Đơn</th>
                    <th className="px-6 py-4 text-right">Số Tiền</th>
                    <th className="px-6 py-4 text-center">Thao Tác</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-zinc-100 dark:divide-zinc-800">
                  {filtered.length === 0 ? (
                    <tr>
                      <td colSpan="7" className="text-center py-10 text-zinc-400 text-sm">
                        Chưa có giao dịch nào trong sổ này.
                      </td>
                    </tr>
                  ) : (
                    filtered.map(tx => {
                      const fund = funds.find(f => f.id === tx.fundId);
                      return (
                        <tr key={tx.id} className="hover:bg-zinc-50/50 dark:hover:bg-zinc-800/30 transition">
                          <td className="px-6 py-4 font-medium text-xs text-zinc-500 whitespace-nowrap">{tx.date}</td>
                          <td className="px-6 py-4 font-bold text-zinc-900 dark:text-zinc-100">{tx.note}</td>
                          <td className="px-6 py-4">
                            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold" style={{ backgroundColor: `${fund?.color}20`, color: fund?.color }}>
                              <span className="w-2 h-2 rounded-full" style={{ backgroundColor: fund?.color }}></span>
                              {fund?.name}
                            </span>
                          </td>
                          <td className="px-6 py-4">
                            <span className="px-2.5 py-1 rounded-lg bg-zinc-100 dark:bg-zinc-800 text-xs font-bold text-zinc-700 dark:text-zinc-300">
                              👤 {tx.userName}
                            </span>
                          </td>
                          <td className="px-6 py-4">
                            {tx.receiptUrl ? (
                              <button
                                onClick={() => onViewReceipt(tx.receiptUrl)}
                                className="text-xs font-bold text-emerald-600 hover:underline flex items-center gap-1"
                              >
                                <span>🧾</span> Xem ảnh
                              </button>
                            ) : (
                              <span className="text-zinc-400 text-xs">-</span>
                            )}
                          </td>
                          <td className="px-6 py-4 text-right font-black text-rose-500 whitespace-nowrap">
                            -{formatVND(tx.amount)}
                          </td>
                          <td className="px-6 py-4 text-center">
                            <button
                              onClick={() => onDeleteTransaction(tx.id)}
                              className="text-xs text-zinc-400 hover:text-rose-500 font-bold p-1 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/40 transition"
                              title="Xóa giao dịch này"
                            >
                              🗑️
                            </button>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. ANALYTICS VIEW
    // ==========================================
    function AnalyticsView({
      currentWorkspaceData,
      funds,
      activeWorkspace,
      selectedMonth,
      setSelectedMonth,
      availableMonths = [],
      onNavigateToMonth,
    }) {
      const monthComparisonChartRef = useRef(null);
      const monthComparisonChartInstance = useRef(null);

      const fundComparisonChartRef = useRef(null);
      const fundComparisonChartInstance = useRef(null);

      const currentPieChartRef = useRef(null);
      const currentPieChartInstance = useRef(null);

      // BỘ LỌC CHO BẢNG TỔNG HỢP
      const [periodFilter, setPeriodFilter] = useState('all'); // 'all' | 'last3' | 'last6' | 'year2026'
      const [healthFilter, setHealthFilter] = useState('all'); // 'all' | 'savings' | 'safe' | 'over'
      const [tableSearch, setTableSearch] = useState('');

      // 1. TẬP HỢP TẤT CẢ CÁC THÁNG THEO THỨ TỰ THỜI GIAN (TĂNG DẦN ĐỂ VẼ BIỂU ĐỒ)
      const allMonthsChronological = useMemo(() => {
        const curRealMonth = new Date().toISOString().slice(0, 7);
        const monthSet = new Set(['2026-08', '2026-09', '2026-10', curRealMonth]);
        if (selectedMonth) monthSet.add(selectedMonth);
        if (currentWorkspaceData?.monthlyBudgets) {
          Object.keys(currentWorkspaceData.monthlyBudgets).forEach(m => monthSet.add(m));
        }
        if (currentWorkspaceData?.transactions) {
          currentWorkspaceData.transactions.forEach(t => {
            if (t.date && t.date.length >= 7) monthSet.add(t.date.slice(0, 7));
          });
        }
        return Array.from(monthSet).sort(); // chronological: e.g. 2026-08, 2026-09, 2026-10
      }, [currentWorkspaceData, selectedMonth]);

      // 2. TÍNH TOÁN METRICS CHI TIẾT TỪNG THÁNG
      const monthlySummaries = useMemo(() => {
        if (!currentWorkspaceData) return [];
        const transactions = currentWorkspaceData.transactions || [];
        const mbs = currentWorkspaceData.monthlyBudgets || {};
        const defaultIncome = currentWorkspaceData.monthlyIncome || 20000000;
        const defaultAllocations = currentWorkspaceData.allocations || { f1: 55, f2: 10, f3: 10, f4: 10, f5: 10, f6: 5 };

        return allMonthsChronological.map(m => {
          const budget = mbs[m] || { monthlyIncome: defaultIncome, allocations: defaultAllocations };
          const income = budget.monthlyIncome !== undefined ? budget.monthlyIncome : defaultIncome;
          const monthTxs = transactions.filter(t => t.date && t.date.startsWith(m));
          const spent = monthTxs.reduce((sum, t) => sum + t.amount, 0);
          const savings = income - spent;
          const burnRate = income > 0 ? Math.round((spent / income) * 100) : 0;
          const savingsRate = income > 0 ? Math.round((savings / income) * 100) : 0;

          // Chi tiêu theo từng hũ quỹ
          const fundSpending = {};
          funds.forEach(f => { fundSpending[f.id] = 0; });
          monthTxs.forEach(t => {
            if (fundSpending[t.fundId] !== undefined) {
              fundSpending[t.fundId] += t.amount;
            } else {
              fundSpending[t.fundId] = t.amount;
            }
          });

          // Quỹ chi nhiều nhất
          let topFundId = funds[0]?.id || 'f1';
          let maxSpentInFund = -1;
          funds.forEach(f => {
            const amt = fundSpending[f.id] || 0;
            if (amt > maxSpentInFund) {
              maxSpentInFund = amt;
              topFundId = f.id;
            }
          });
          const topFund = funds.find(f => f.id === topFundId) || funds[0];

          // Đánh giá sức khỏe tài chính
          let healthStatus = 'good';
          let healthLabel = '✓ Tài chính khỏe mạnh';
          let healthBadgeClass = 'text-emerald-700 bg-emerald-100/80 dark:bg-emerald-950/60 dark:text-emerald-300 border-emerald-300 dark:border-emerald-800';
          let healthType = 'safe';

          if (spent > income) {
            healthStatus = 'over';
            healthLabel = '🚨 Bội chi ngân sách';
            healthBadgeClass = 'text-rose-700 bg-rose-100/80 dark:bg-rose-950/60 dark:text-rose-300 border-rose-300 dark:border-rose-800';
            healthType = 'over';
          } else if (savingsRate >= 25) {
            healthStatus = 'excellent';
            healthLabel = '🌟 Tích lũy xuất sắc';
            healthBadgeClass = 'text-teal-700 bg-teal-100/80 dark:bg-teal-950/60 dark:text-teal-300 border-teal-300 dark:border-teal-800';
            healthType = 'savings';
          } else if (savingsRate >= 15) {
            healthStatus = 'good';
            healthLabel = '✓ Chi tiêu chuẩn mực';
            healthBadgeClass = 'text-emerald-700 bg-emerald-100/80 dark:bg-emerald-950/60 dark:text-emerald-300 border-emerald-300 dark:border-emerald-800';
            healthType = 'savings';
          } else {
            healthStatus = 'warning';
            healthLabel = '⚠️ Cảnh báo chi sát mức';
            healthBadgeClass = 'text-amber-700 bg-amber-100/80 dark:bg-amber-950/60 dark:text-amber-300 border-amber-300 dark:border-amber-800';
            healthType = 'safe';
          }

          return {
            month: m,
            monthDisplay: formatMonthDisplay(m),
            income,
            spent,
            savings,
            burnRate,
            savingsRate,
            txCount: monthTxs.length,
            fundSpending,
            topFund,
            topFundAmount: maxSpentInFund,
            healthStatus,
            healthLabel,
            healthBadgeClass,
            healthType,
          };
        });
      }, [allMonthsChronological, currentWorkspaceData, funds]);

      // 3. DANH SÁCH LỌC CHO BẢNG TỔNG HỢP (XẾP THÁNG MỚI NHẤT LÊN ĐẦU)
      const filteredSummaries = useMemo(() => {
        let list = [...monthlySummaries].reverse(); // Tháng mới nhất lên trên

        // Lọc khoảng thời gian
        if (periodFilter === 'last3') {
          list = list.slice(0, 3);
        } else if (periodFilter === 'last6') {
          list = list.slice(0, 6);
        } else if (periodFilter === 'year2026') {
          list = list.filter(s => s.month.startsWith('2026'));
        }

        // Lọc sức khỏe tài chính
        if (healthFilter === 'savings') {
          list = list.filter(s => s.savingsRate >= 15 && s.spent <= s.income);
        } else if (healthFilter === 'safe') {
          list = list.filter(s => s.spent <= s.income);
        } else if (healthFilter === 'over') {
          list = list.filter(s => s.spent > s.income);
        }

        // Tìm kiếm theo từ khóa
        if (tableSearch.trim()) {
          const q = tableSearch.trim().toLowerCase();
          list = list.filter(s =>
            s.monthDisplay.toLowerCase().includes(q) ||
            s.topFund.name.toLowerCase().includes(q) ||
            s.healthLabel.toLowerCase().includes(q)
          );
        }

        return list;
      }, [monthlySummaries, periodFilter, healthFilter, tableSearch]);

      // 4. TỔNG HỢP LŨY KẾ & KPI
      const cumulativeMetrics = useMemo(() => {
        const totalInc = monthlySummaries.reduce((acc, s) => acc + s.income, 0);
        const totalSp = monthlySummaries.reduce((acc, s) => acc + s.spent, 0);
        const totalSav = totalInc - totalSp;
        const avgSavRate = totalInc > 0 ? Math.round((totalSav / totalInc) * 100) : 0;

        return {
          totalIncome: totalInc,
          totalSpent: totalSp,
          totalSavings: totalSav,
          averageSavingsRate: avgSavRate,
          monthsCount: monthlySummaries.length,
        };
      }, [monthlySummaries]);

      // 5. BIỂU ĐỒ 1: SO SÁNH THU - CHI - DƯ TÍCH LŨY GIỮA CÁC THÁNG
      useEffect(() => {
        if (!monthComparisonChartRef.current) return;
        if (monthComparisonChartInstance.current) monthComparisonChartInstance.current.destroy();

        const ctx = monthComparisonChartRef.current.getContext('2d');
        const labels = monthlySummaries.map(s => s.monthDisplay.replace('Tháng ', 'T'));
        const incomeData = monthlySummaries.map(s => s.income);
        const spentData = monthlySummaries.map(s => s.spent);
        const savingsData = monthlySummaries.map(s => Math.max(0, s.savings));

        monthComparisonChartInstance.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              {
                label: 'Số tiền thu (Thu nhập)',
                data: incomeData,
                backgroundColor: '#10B981',
                borderRadius: 8,
              },
              {
                label: 'Số tiền tiêu (Thực chi)',
                data: spentData,
                backgroundColor: '#F43F5E',
                borderRadius: 8,
              },
              {
                label: 'Dư tích lũy (Tiết kiệm ròng)',
                data: savingsData,
                backgroundColor: '#3B82F6',
                borderRadius: 8,
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                labels: { font: { family: 'Plus Jakarta Sans', size: 11, weight: 'bold' }, color: '#a1a1aa' }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return context.dataset.label + ': ' + formatVND(context.raw);
                  }
                }
              }
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: { font: { family: 'Plus Jakarta Sans', size: 11, weight: 'bold' }, color: '#a1a1aa' }
              },
              y: {
                grid: { color: 'rgba(161, 161, 170, 0.1)' },
                ticks: {
                  font: { family: 'Plus Jakarta Sans', size: 10 },
                  color: '#a1a1aa',
                  callback: val => compactVND(val)
                }
              }
            }
          }
        });

        return () => {
          if (monthComparisonChartInstance.current) monthComparisonChartInstance.current.destroy();
        };
      }, [monthlySummaries]);

      // 6. BIỂU ĐỒ 2: SO SÁNH CÁC QUÝ/HŨ ĐÃ SỬ DỤNG GIỮA CÁC THÁNG
      useEffect(() => {
        if (!fundComparisonChartRef.current) return;
        if (fundComparisonChartInstance.current) fundComparisonChartInstance.current.destroy();

        const ctx = fundComparisonChartRef.current.getContext('2d');
        const fundLabels = funds.map(f => f.name.split(' ')[0]);

        // Lấy 3 tháng gần nhất để so sánh trực quan
        const recentMonths = monthlySummaries.slice(-3);
        const palette = ['#8B5CF6', '#F59E0B', '#10B981'];

        const datasets = recentMonths.map((m, idx) => ({
          label: m.monthDisplay,
          data: funds.map(f => m.fundSpending[f.id] || 0),
          backgroundColor: palette[idx % palette.length],
          borderRadius: 6,
        }));

        fundComparisonChartInstance.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: fundLabels,
            datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                labels: { font: { family: 'Plus Jakarta Sans', size: 11, weight: 'bold' }, color: '#a1a1aa' }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return context.dataset.label + ': ' + formatVND(context.raw);
                  }
                }
              }
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: { font: { family: 'Plus Jakarta Sans', size: 11, weight: 'bold' }, color: '#a1a1aa' }
              },
              y: {
                grid: { color: 'rgba(161, 161, 170, 0.1)' },
                ticks: {
                  font: { family: 'Plus Jakarta Sans', size: 10 },
                  color: '#a1a1aa',
                  callback: val => compactVND(val)
                }
              }
            }
          }
        });

        return () => {
          if (fundComparisonChartInstance.current) fundComparisonChartInstance.current.destroy();
        };
      }, [monthlySummaries, funds]);

      // 7. XUẤT BÁO CÁO RA FILE CSV / EXCEL (HỖ TRỢ TIẾNG VIỆT CÓ DẤU UTF-8 BOM)
      const handleExportCSV = () => {
        const headers = [
          'Thang',
          'So_Tien_Thu_VND',
          'So_Tien_Tieu_VND',
          'Du_Tich_Luy_VND',
          'Ty_Le_Chi_Tieu_Pct',
          'Ty_Le_Tiet_Kiem_Pct',
          'Quy_Chi_Nhieu_Nhat',
          'Tien_Quy_Nhieu_Nhat_VND',
          'Danh_Gia_Suc_Khoe'
        ];

        const rows = filteredSummaries.map(s => [
          `"${s.monthDisplay}"`,
          s.income,
          s.spent,
          s.savings,
          `"${s.burnRate}%"`,
          `"${s.savingsRate}%"`,
          `"${s.topFund.name}"`,
          s.topFundAmount,
          `"${s.healthLabel.replace(/[🚨🌟✓⚠️]/g, '').trim()}"`
        ]);

        // Thêm Byte Order Mark (BOM) UTF-8 để Microsoft Excel trên Windows tự nhận font tiếng Việt
        const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `finflow-bang-tong-hop-thu-chi-${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Tìm quỹ có sự biến động lớn nhất giữa tháng này so với tháng trước
      const volatilityInsight = useMemo(() => {
        if (monthlySummaries.length < 2) return null;
        const current = monthlySummaries[monthlySummaries.length - 1];
        const prev = monthlySummaries[monthlySummaries.length - 2];

        let maxDiff = 0;
        let maxFund = funds[0];
        let diffPct = 0;
        let isIncrease = true;

        funds.forEach(f => {
          const curAmt = current.fundSpending[f.id] || 0;
          const prevAmt = prev.fundSpending[f.id] || 0;
          const diff = Math.abs(curAmt - prevAmt);
          if (diff > maxDiff) {
            maxDiff = diff;
            maxFund = f;
            isIncrease = curAmt >= prevAmt;
            diffPct = prevAmt > 0 ? Math.round((diff / prevAmt) * 100) : 100;
          }
        });

        return {
          fund: maxFund,
          diff: maxDiff,
          diffPct,
          isIncrease,
          currentMonth: current.monthDisplay,
          prevMonth: prev.monthDisplay,
        };
      }, [monthlySummaries, funds]);

      return (
        <div className="space-y-6">
          {/* HEADER & XUẤT BÁO CÁO */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-6 rounded-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-sm">
            <div>
              <span className="text-[11px] font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/60 px-2.5 py-1 rounded-full">
                📊 Phân Tích & So Sánh Đa Chiều
              </span>
              <h2 className="text-2xl font-black text-zinc-900 dark:text-zinc-50 tracking-tight mt-1.5">
                Báo Cáo Thu - Chi & So Sánh Các Quỹ Qua Từng Tháng
              </h2>
              <p className="text-xs text-zinc-400 mt-1">
                Theo dõi biến động dòng tiền, so sánh chi tiêu giữa các tháng và tổng hợp đa chiều ({activeWorkspace === 'personal' ? 'Cá Nhân' : 'Gia Đình'}).
              </p>
            </div>

            <button
              onClick={handleExportCSV}
              className="px-5 py-2.5 rounded-2xl bg-zinc-900 hover:bg-zinc-800 text-white dark:bg-zinc-100 dark:text-zinc-900 dark:hover:bg-zinc-200 font-bold text-xs shadow-md transition flex items-center gap-2 self-start sm:self-auto"
              title="Xuất bảng tổng hợp ra file Excel/CSV chuẩn tiếng Việt"
            >
              <span>📥</span>
              <span>Xuất Báo Cáo (CSV/Excel)</span>
            </button>
          </div>

          {/* 4 THẺ KPI TỔNG HỢP LŨY KẾ */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="p-5 rounded-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-sm flex flex-col justify-between">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-zinc-400">Tổng Thu Lũy Kế</span>
                <p className="text-2xl font-black text-emerald-600 dark:text-emerald-400 mt-2">{formatVND(cumulativeMetrics.totalIncome)}</p>
              </div>
              <p className="text-[11px] text-zinc-400 mt-3 pt-2 border-t border-zinc-100 dark:border-zinc-800">
                Qua {cumulativeMetrics.monthsCount} tháng đã ghi chép
              </p>
            </div>

            <div className="p-5 rounded-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-sm flex flex-col justify-between">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-zinc-400">Tổng Thực Chi Lũy Kế</span>
                <p className="text-2xl font-black text-rose-500 mt-2">{formatVND(cumulativeMetrics.totalSpent)}</p>
              </div>
              <p className="text-[11px] text-zinc-400 mt-3 pt-2 border-t border-zinc-100 dark:border-zinc-800">
                Tỷ lệ chi tiêu bình quân: <strong>{100 - cumulativeMetrics.averageSavingsRate}%</strong>
              </p>
            </div>

            <div className="p-5 rounded-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-sm flex flex-col justify-between">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-zinc-400">Tổng Dư Tích Lũy</span>
                <p className={`text-2xl font-black mt-2 ${cumulativeMetrics.totalSavings >= 0 ? 'text-blue-500' : 'text-rose-500'}`}>
                  {formatVND(cumulativeMetrics.totalSavings)}
                </p>
              </div>
              <p className="text-[11px] text-zinc-400 mt-3 pt-2 border-t border-zinc-100 dark:border-zinc-800">
                Tỷ lệ tiết kiệm ròng: <strong>{cumulativeMetrics.averageSavingsRate}%</strong>
              </p>
            </div>

            <div className="p-5 rounded-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-sm flex flex-col justify-between">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-zinc-400">Biến Động Nổi Bật</span>
                {volatilityInsight ? (
                  <p className="text-xs font-extrabold text-zinc-800 dark:text-zinc-200 mt-2 line-clamp-2">
                    Quỹ <strong style={{ color: volatilityInsight.fund.color }}>{volatilityInsight.fund.name}</strong> {volatilityInsight.isIncrease ? 'tăng' : 'giảm'} {formatVND(volatilityInsight.diff)} ({volatilityInsight.diffPct}%)
                  </p>
                ) : (
                  <p className="text-xs text-zinc-400 mt-2">Cần ít nhất 2 tháng để so sánh biến động</p>
                )}
              </div>
              <p className="text-[11px] text-zinc-400 mt-3 pt-2 border-t border-zinc-100 dark:border-zinc-800">
                So sánh giữa 2 tháng gần nhất
              </p>
            </div>
          </div>

          {/* 2 BIỂU ĐỒ SO SÁNH LỚN: THU CHI QUA CÁC THÁNG & SO SÁNH TỪNG QUỸ */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* BIỂU ĐỒ 1: SO SÁNH THU NHẬP - THỰC CHI - DƯ TÍCH LŨY */}
            <div className="p-6 rounded-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-sm">
              <div className="mb-4">
                <h3 className="font-extrabold text-base text-zinc-900 dark:text-zinc-50">
                  📈 So Sánh Thu - Chi - Tích Lũy Qua Các Tháng
                </h3>
                <p className="text-xs text-zinc-400 mt-0.5">
                  Đối chiếu giữa Thu nhập, Thực chi và Tiền tiết kiệm ròng giữa các tháng
                </p>
              </div>
              <div className="h-72 relative">
                <canvas ref={monthComparisonChartRef}></canvas>
              </div>
            </div>

            {/* BIỂU ĐỒ 2: SO SÁNH CÁC QUỸ CHI TIÊU GIỮA CÁC THÁNG */}
            <div className="p-6 rounded-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-sm">
              <div className="mb-4">
                <h3 className="font-extrabold text-base text-zinc-900 dark:text-zinc-50">
                  🎯 So Sánh Chi Tiêu Từng Quỹ Giữa Các Tháng
                </h3>
                <p className="text-xs text-zinc-400 mt-0.5">

    // ==========================================
    // MODAL: ĐỔI MẬT KHẨU CHO CÁ NHÂN ĐANG ĐĂNG NHẬP
    // ==========================================
    function ChangePasswordModal({ currentUser, onClose, onChangePassword }) {
      const [oldPassword, setOldPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [showPasswords, setShowPasswords] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');

        // 1. Bắt buộc kiểm tra mật khẩu cũ phải chính xác
        if (oldPassword !== currentUser.password) {
          setError('Mật khẩu hiện tại không chính xác! Vui lòng kiểm tra lại.');
          return;
        }

        // 2. Kiểm tra độ dài mật khẩu mới
        if (!newPassword || newPassword.length < 3) {
          setError('Mật khẩu mới phải có ít nhất 3 ký tự!');
          return;
        }

        // 3. Mật khẩu mới không được trùng mật khẩu cũ
        if (newPassword === oldPassword) {
          setError('Mật khẩu mới không được trùng với mật khẩu cũ!');
          return;
        }

        // 4. Kiểm tra xác nhận mật khẩu mới
        if (newPassword !== confirmPassword) {
          setError('Xác nhận mật khẩu mới không khớp!');
          return;
        }

        onChangePassword(newPassword);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="w-full max-w-md bg-white dark:bg-zinc-900 rounded-3xl p-6 sm:p-8 shadow-2xl border border-zinc-200 dark:border-zinc-800 relative animate-fadeIn">
            <button
              onClick={onClose}
              className="absolute top-5 right-5 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 font-bold text-lg w-8 h-8 rounded-full bg-zinc-100 dark:bg-zinc-800 flex items-center justify-center transition"
            >
              ✕
            </button>

            <div className="text-center mb-6">
              <div className="w-12 h-12 rounded-2xl bg-amber-100 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 flex items-center justify-center text-2xl mx-auto mb-2">
                🔑
              </div>
              <h2 className="text-xl font-black text-zinc-900 dark:text-zinc-50 tracking-tight">
                Đổi Mật Khẩu Cá Nhân
              </h2>
              <p className="text-xs text-zinc-400 mt-1">
                Tài khoản: <strong className="text-zinc-700 dark:text-zinc-300">{currentUser.fullName}</strong> ({currentUser.email})
              </p>
            </div>

            {error && (
              <div className="mb-4 p-3 rounded-2xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900/60 text-rose-600 dark:text-rose-400 text-xs font-semibold flex items-center gap-2">
                <span>⚠️</span> {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="text-xs font-bold uppercase tracking-wider text-zinc-500 block mb-1">
                  1. Mật Khẩu Hiện Tại (Mật khẩu cũ) *
                </label>
                <input
                  type={showPasswords ? 'text' : 'password'}
                  required
                  autoFocus
                  placeholder="Nhập mật khẩu bạn đang dùng"
                  value={oldPassword}
                  onChange={(e) => setOldPassword(e.target.value)}
                  className="w-full bg-zinc-50 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-2.5 text-xs font-bold outline-none focus:ring-2 focus:ring-emerald-500 text-zinc-900 dark:text-zinc-100"
                />
              </div>

              <div>
                <label className="text-xs font-bold uppercase tracking-wider text-zinc-500 block mb-1">
                  2. Mật Khẩu Mới *
                </label>
                <input
                  type={showPasswords ? 'text' : 'password'}
                  required
                  placeholder="Nhập mật khẩu mới muốn đổi"
                  value={newPassword}

                  <p className="text-xs text-zinc-600 dark:text-zinc-300 leading-relaxed">
                    FinFlow bảo vệ chi tiêu của bạn thông qua 3 cơ chế tự động:
                  </p>
                  <ul className="text-xs text-zinc-600 dark:text-zinc-300 space-y-1.5 list-disc pl-4">
                    <li><strong>Tầng 1 (Offline-First Browser):</strong> Chi tiêu được lưu ngay vào bộ nhớ trình duyệt điện thoại/máy tính của bạn. Kể cả khi tắt máy hay Render sleep, chi tiêu không bao giờ mất.</li>
                    <li><strong>Tầng 2 (Auto-Healing Server):</strong> Mỗi lần bạn mở web, trình duyệt tự động kiểm tra và chữa lành máy chủ — tự phục hồi những giao dịch còn thiếu.</li>
                    <li><strong>Tầng 3 (Sao Lưu Tùy Chọn):</strong> Bạn có thể tải file sao lưu JSON về máy bất cứ lúc nào và khôi phục lại chỉ với 1 cú chạm.</li>
                  </ul>
                </div>

                {/* 2 NÚT THAO TÁC: TẢI VỀ & KHÔI PHỤC */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {/* NÚT TẢI VỀ SAO LƯU */}
                  <div className="p-4 rounded-2xl bg-zinc-50 dark:bg-zinc-850 border border-zinc-200 dark:border-zinc-700 space-y-2 text-center sm:text-left flex flex-col justify-between">
                    <div>
                      <div className="flex items-center gap-2 mb-1 justify-center sm:justify-start">
                        <span className="text-lg">📥</span>
                        <span className="text-xs font-bold uppercase tracking-wider text-zinc-800 dark:text-zinc-200">Tải File Sao Lưu</span>
                      </div>
                      <p className="text-[11px] text-zinc-500 dark:text-zinc-400">
                        Xuất toàn bộ chi tiêu, tài khoản và kế hoạch thành file JSON để lưu trữ trên máy tính/điện thoại.
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => {
                        if (onExportData) onExportData();
                      }}
                      className="w-full mt-3 px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2 active:scale-95"
                    >
                      <span>📥</span>
                      <span>Tải Về File Sao Lưu (.json)</span>
                    </button>
                  </div>

                  {/* NÚT KHÔI PHỤC TỪ FILE */}
                  <div className="p-4 rounded-2xl bg-zinc-50 dark:bg-zinc-850 border border-zinc-200 dark:border-zinc-700 space-y-2 text-center sm:text-left flex flex-col justify-between">
                    <div>
                      <div className="flex items-center gap-2 mb-1 justify-center sm:justify-start">
                        <span className="text-lg">📤</span>
                        <span className="text-xs font-bold uppercase tracking-wider text-zinc-800 dark:text-zinc-200">Khôi Phục Dữ Liệu</span>
                      </div>
                      <p className="text-[11px] text-zinc-500 dark:text-zinc-400">
                        Nạp file sao lưu FinFlow (.json) để khôi phục toàn bộ chi tiêu trên thiết bị mới bất kỳ lúc nào.
                      </p>
                    </div>
                    <input
                      type="file"
                      ref={fileInputRef}
                      accept=".json,application/json"
                      className="hidden"
                      onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (evt) => {
                          try {
                            const content = evt.target.result;
                            if (onImportData) {
                              const ok = onImportData(content);
                              if (ok) {
                                setImportStatus('✅ Đã nạp thành công!');
                                setTimeout(() => setImportStatus(null), 3000);
                              }
                            }
                          } catch (err) {
                            alert('Không thể đọc file: ' + err.message);
                          }
                        };
                        reader.readAsText(file);
                        e.target.value = '';
                      }}
                    />
                    <button
                      type="button"
                      onClick={() => fileInputRef.current?.click()}
                      className="w-full mt-3 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-md shadow-blue-600/20 transition flex items-center justify-center gap-2 active:scale-95"
                    >
                      <span>📤</span>
                      <span>{importStatus || 'Chọn File Khôi Phục (.json)'}</span>
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }
