    // ==========================================
    // 7. ADD TRANSACTION MODAL (Ghi chép nhanh)
    // ==========================================
    function AddTransactionModal({ funds, currentUser, activeWorkspace, onClose, onAdd }) {
      const [inputMode, setInputMode] = useState('smart'); // 'smart' | 'presets' | 'numpad'

      const [smartText, setSmartText] = useState('');
      const [amount, setAmount] = useState('');
      const [fundId, setFundId] = useState(funds[0]?.id || '');
      const [note, setNote] = useState('');
      const [date, setDate] = useState(() => new Date().toISOString().slice(0, 10));
      const [receiptPreview, setReceiptPreview] = useState(null);
      const [ocrProcessing, setOcrProcessing] = useState(false);

      const QUICK_CHIPS = [
        { label: '☕ Cà phê', amount: 35000, fundName: 'Hưởng thụ & Du lịch', note: 'Cà phê sáng' },
        { label: '🍜 Ăn sáng', amount: 40000, fundName: 'Thiết yếu', note: 'Ăn sáng bánh mì/phở' },
        { label: '🍱 Cơm trưa', amount: 50000, fundName: 'Thiết yếu', note: 'Cơm trưa văn phòng' },
        { label: '⛽ Đổ xăng', amount: 80000, fundName: 'Thiết yếu', note: 'Đổ xăng xe' },
        { label: '🛒 Đi siêu thị', amount: 250000, fundName: 'Thiết yếu', note: 'Thực phẩm WinMart/chợ' },
        { label: '🥤 Trà sữa/Snack', amount: 45000, fundName: 'Hưởng thụ & Du lịch', note: 'Trà sữa chiều' },
        { label: '💊 Thuốc men', amount: 120000, fundName: 'Thiết yếu', note: 'Thuốc cảm/Vitamin' },
        { label: '📚 Mua sách', amount: 150000, fundName: 'Học tập & Sách vở', note: 'Sách & tài liệu' },
        { label: '💡 Tiền điện nước', amount: 1200000, fundName: 'Thiết yếu', note: 'Hóa đơn điện nước tháng' },
        { label: '🧧 Mừng cưới/Hiếu hỉ', amount: 500000, fundName: 'Cho đi & Hiếu hỉ', note: 'Tiền mừng hiếu hỉ' },
      ];

      // Smart NLP Parser
      const parsedSmartInput = useMemo(() => {
        if (!smartText.trim()) return null;

        const text = smartText.trim().toLowerCase();
        let extractedAmount = 0;
        let cleanNote = text;

        const matchTr = text.match(/(\d+(?:[.,]\d+)?)\s*(?:tr|trieu|m)\b/i);
        const matchK = text.match(/(\d+(?:[.,]\d+)?)\s*(?:k|nghin|ngàn)\b/i);
        const matchRawNum = text.match(/\b(\d{4,9})\b/);

        if (matchTr) {
          const num = parseFloat(matchTr[1].replace(',', '.'));
          extractedAmount = Math.round(num * 1000000);
          cleanNote = text.replace(matchTr[0], '').trim();
        } else if (matchK) {
          const num = parseFloat(matchK[1].replace(',', '.'));
          extractedAmount = Math.round(num * 1000);
          cleanNote = text.replace(matchK[0], '').trim();
        } else if (matchRawNum) {
          extractedAmount = parseInt(matchRawNum[1], 10);
          cleanNote = text.replace(matchRawNum[0], '').trim();
        }

        let guessedFund = funds[0];
        if (/(cafe|cà phê|tra sua|trà sữa|du lich|du lịch|xem phim|an vat|ăn vặt|nhau|nhậu|party)/i.test(text)) {
          guessedFund = funds.find(f => f.name.includes('Hưởng thụ')) || guessedFund;
        } else if (/(sach|sách|khoa hoc|khóa học|tieng anh|tiếng anh|hoc|học)/i.test(text)) {
          guessedFund = funds.find(f => f.name.includes('Học tập')) || guessedFund;
        } else if (/(tiet kiem|tiết kiệm|gui ngan hang|gửi ngân hàng)/i.test(text)) {
          guessedFund = funds.find(f => f.name.includes('Tiết kiệm')) || guessedFund;
        } else if (/(dau tu|đầu tư|chung khoan|chứng khoán|vang|vàng|crypto|co phieu|cổ phiếu)/i.test(text)) {
          guessedFund = funds.find(f => f.name.includes('Đầu tư')) || guessedFund;
        } else if (/(tu thien|từ thiện|mung|mừng|hieu hi|hiếu hỉ|cho|biếu)/i.test(text)) {
          guessedFund = funds.find(f => f.name.includes('Cho đi')) || guessedFund;
        } else {
          guessedFund = funds.find(f => f.name.includes('Thiết yếu')) || guessedFund;
        }

        const formattedNote = cleanNote
          ? cleanNote.charAt(0).toUpperCase() + cleanNote.slice(1)
          : 'Chi tiêu hằng ngày';

        return {
          amount: extractedAmount,
          fund: guessedFund,
          note: formattedNote,
        };
      }, [smartText, funds]);

      const handleNumpadPress = (char) => {
        if (char === 'DEL') {
          setAmount(prev => prev.toString().slice(0, -1));
        } else if (char === 'C') {
          setAmount('');
        } else if (char === '+50k') {
          setAmount(prev => (Number(prev) || 0) + 50000);
        } else if (char === '+100k') {
          setAmount(prev => (Number(prev) || 0) + 100000);
        } else if (char === '+500k') {
          setAmount(prev => (Number(prev) || 0) + 500000);
        } else {
          setAmount(prev => (prev ? prev.toString() + char : char));
        }
      };

      const handleApplyChip = (chip, autoSubmit = false) => {
        const targetFund = funds.find(f => f.name.includes(chip.fundName.split(' ')[0])) || funds[0];
        if (autoSubmit) {
          onAdd({
            id: 'tx-' + Date.now(),
            fundId: targetFund.id,
            amount: chip.amount,
            date,
            note: chip.note,
            userName: currentUser.fullName, // Người chi là chính tài khoản đang đăng nhập!
            receiptUrl: null,
          });
        } else {
          setAmount(chip.amount);
          setNote(chip.note);
          setFundId(targetFund.id);
          setInputMode('numpad');
        }
      };

      const handleSmartSubmit = (e) => {
        if (e) e.preventDefault();
        if (!parsedSmartInput || parsedSmartInput.amount <= 0) {
          alert('Vui lòng gõ nội dung kèm số tiền (Ví dụ: "an trua 45k" hoặc "cafe 35k")');
          return;
        }
        onAdd({
          id: 'tx-' + Date.now(),
          fundId: parsedSmartInput.fund.id,
          amount: parsedSmartInput.amount,
          date,
          note: parsedSmartInput.note,
          userName: currentUser.fullName,
          receiptUrl: receiptPreview,
        });
      };

      const handleNumpadSubmit = (e) => {
        if (e) e.preventDefault();
        const num = Number(amount);
        if (!num || num <= 0) {
          alert('Vui lòng nhập số tiền hợp lệ!');
          return;
        }
        onAdd({
          id: 'tx-' + Date.now(),
          fundId,
          amount: num,
          date,
          note: note.trim() || 'Chi tiêu hằng ngày',
          userName: currentUser.fullName,
          receiptUrl: receiptPreview,
        });
      };

      const handleImageUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          setOcrProcessing(true);
          const reader = new FileReader();
          reader.onload = (event) => {
            setReceiptPreview(event.target.result);
            setTimeout(() => {
              setOcrProcessing(false);
              setAmount(185000);
              setNote('Hóa đơn mua sắm');
              setInputMode('numpad');
            }, 800);
          };
          reader.readAsDataURL(file);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="w-full max-w-lg bg-white dark:bg-zinc-900 rounded-t-[32px] sm:rounded-3xl p-5 sm:p-7 shadow-2xl border border-zinc-200 dark:border-zinc-800 relative max-h-[92vh] sm:max-h-[95vh] overflow-y-auto animate-fadeIn">
            {/* Mobile Sheet Drag Indicator */}
            <div className="w-12 h-1 bg-zinc-300 dark:bg-zinc-700 rounded-full mx-auto mb-3 sm:hidden"></div>

            <button
              onClick={onClose}
              className="absolute top-5 right-5 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 font-bold text-lg w-8 h-8 rounded-full bg-zinc-100 dark:bg-zinc-800 flex items-center justify-center transition"
            >
              ✕
            </button>

            {/* Header */}
            <div className="mb-4">
              <span className="text-[11px] font-bold tracking-wider text-emerald-600 dark:text-emerald-400 uppercase bg-emerald-50 dark:bg-emerald-950/60 px-2.5 py-1 rounded-full">
                ⚡ Ghi Chép Cho {activeWorkspace === 'personal' ? 'Cá Nhân' : 'Gia Đình'}
              </span>
              <h2 className="text-xl sm:text-2xl font-black text-zinc-900 dark:text-zinc-50 tracking-tight mt-1.5 flex items-center gap-2">
                Chi Tiêu Bởi: <span className="text-emerald-600 dark:text-emerald-400">{currentUser.fullName}</span>
              </h2>
            </div>

            {/* TAB CHUYỂN ĐỔI CHẾ ĐỘ NHẬP */}
            <div className="grid grid-cols-3 gap-1 p-1 bg-zinc-100 dark:bg-zinc-800/80 rounded-2xl mb-4 text-xs font-bold">
              <button
                type="button"
                onClick={() => setInputMode('smart')}
                className={`py-2 rounded-xl transition flex items-center justify-center gap-1.5 ${
                  inputMode === 'smart'
                    ? 'bg-white dark:bg-zinc-900 text-emerald-600 dark:text-emerald-400 shadow-sm'
                    : 'text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-200'
                }`}
              >
                <span>🤖</span> Gõ Tự Nhiên
              </button>
              <button
                type="button"
                onClick={() => setInputMode('presets')}
                className={`py-2 rounded-xl transition flex items-center justify-center gap-1.5 ${
                  inputMode === 'presets'
                    ? 'bg-white dark:bg-zinc-900 text-emerald-600 dark:text-emerald-400 shadow-sm'
                    : 'text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-200'
                }`}
              >
                <span>⚡</span> 1-Chạm Nhanh
              </button>
              <button
                type="button"
                onClick={() => setInputMode('numpad')}
                className={`py-2 rounded-xl transition flex items-center justify-center gap-1.5 ${
                  inputMode === 'numpad'
                    ? 'bg-white dark:bg-zinc-900 text-emerald-600 dark:text-emerald-400 shadow-sm'
                    : 'text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-200'
                }`}
              >
                <span>🔢</span> Bàn Phím Số
              </button>
            </div>

            {/* 1. CHẾ ĐỘ: GÕ CÚ PHÁP TỰ NHIÊN (SMART NLP) */}
            {inputMode === 'smart' && (
              <form onSubmit={handleSmartSubmit} className="space-y-4">
                <div className="p-4 rounded-2xl bg-zinc-50 dark:bg-zinc-850 border border-zinc-200/80 dark:border-zinc-800">
                  <label className="text-xs font-bold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 flex items-center gap-1">
                    <span>💬</span> Gõ câu chi tiêu bất kỳ (Tự bóc tách tiền & quỹ):
                  </label>
                  <input
                    type="text"
                    autoFocus
                    placeholder="Ví dụ: an trua 45k, cafe 35k, do xang 80k, sieu thi 250k..."
                    value={smartText}
                    onChange={(e) => setSmartText(e.target.value)}
                    className="w-full mt-2 text-base font-bold bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-3 text-zinc-900 dark:text-zinc-100 outline-none focus:ring-2 focus:ring-emerald-500"
                  />

                  {parsedSmartInput && parsedSmartInput.amount > 0 ? (
                    <div className="mt-3 p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 flex items-center justify-between animate-fadeIn">
                      <div className="flex items-center gap-2.5">
                        <span className="w-3 h-3 rounded-full" style={{ backgroundColor: parsedSmartInput.fund.color }}></span>
                        <div>
                          <p className="text-xs font-extrabold text-zinc-900 dark:text-zinc-100">
                            {parsedSmartInput.note}
                          </p>
                          <span className="text-[11px] text-zinc-500 dark:text-zinc-400">
                            Quỹ: <strong>{parsedSmartInput.fund.name}</strong>
                          </span>
                        </div>
                      </div>
                      <div className="text-right">
                        <span className="text-base font-black text-rose-500">
                          -{formatVND(parsedSmartInput.amount)}
                        </span>
                        <span className="block text-[10px] text-emerald-600 dark:text-emerald-400 font-bold">
                          ✓ Đã nhận diện
                        </span>
                      </div>
                    </div>
                  ) : (
                    <div className="mt-2 flex flex-wrap gap-1.5 text-[11px] text-zinc-400">
                      <span>Gợi ý mẫu:</span>
                      <button type="button" onClick={() => setSmartText('an trua 50k')} className="underline hover:text-emerald-500">an trua 50k</button>
                      <span>&bull;</span>
                      <button type="button" onClick={() => setSmartText('cafe 40k')} className="underline hover:text-emerald-500">cafe 40k</button>
                      <span>&bull;</span>
                      <button type="button" onClick={() => setSmartText('sieu thi 320k')} className="underline hover:text-emerald-500">sieu thi 320k</button>
                      <span>&bull;</span>
                      <button type="button" onClick={() => setSmartText('do xang 80k')} className="underline hover:text-emerald-500">do xang 80k</button>
                    </div>
                  )}
                </div>

                <button
                  type="submit"
                  disabled={!parsedSmartInput || parsedSmartInput.amount <= 0}
                  className={`w-full py-3.5 rounded-2xl font-bold text-sm transition shadow-lg flex items-center justify-center gap-2 ${
                    parsedSmartInput && parsedSmartInput.amount > 0
                      ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-600/30 active:scale-98 cursor-pointer'
                      : 'bg-zinc-200 text-zinc-400 dark:bg-zinc-800 dark:text-zinc-600 cursor-not-allowed'
                  }`}
                >
                  <span>⚡</span> Nhấn Enter để Lưu Ngay Cho {currentUser.fullName}
                </button>
              </form>
            )}

            {/* 2. CHẾ ĐỘ: 1-CHẠM ĂN NGAY (QUICK CHIPS) */}
            {inputMode === 'presets' && (
              <div className="space-y-4">
                <p className="text-xs text-zinc-500 dark:text-zinc-400">
                  Chạm vào mục dưới đây để ghi chép tức thời trong <strong>đúng 1 giây</strong> cho <strong>{currentUser.fullName}</strong>:
                </p>

                <div className="grid grid-cols-2 gap-2.5">
                  {QUICK_CHIPS.map((chip, idx) => (
                    <div
                      key={idx}
                      className="p-3 rounded-2xl bg-zinc-50 dark:bg-zinc-800/60 border border-zinc-200/80 dark:border-zinc-800 hover:border-emerald-500 dark:hover:border-emerald-500 transition group flex flex-col justify-between"
                    >
                      <div>
                        <div className="flex items-center justify-between">
                          <span className="font-extrabold text-xs text-zinc-900 dark:text-zinc-100">
                            {chip.label}
                          </span>
                          <span className="text-[10px] text-zinc-400">
                            {chip.fundName.split(' ')[0]}
                          </span>
                        </div>
                        <p className="text-sm font-black text-rose-500 mt-1">
                          -{formatVND(chip.amount)}
                        </p>
                      </div>

                      <div className="mt-2.5 flex items-center gap-1.5">
                        <button
                          type="button"
                          onClick={() => handleApplyChip(chip, true)}
                          className="flex-1 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[11px] transition shadow-sm active:scale-95"
                        >
                          ⚡ 1-Chạm Lưu
                        </button>
                        <button
                          type="button"
                          onClick={() => handleApplyChip(chip, false)}
                          className="px-2 py-1.5 rounded-xl bg-zinc-200 hover:bg-zinc-300 dark:bg-zinc-700 dark:hover:bg-zinc-600 text-zinc-700 dark:text-zinc-200 text-[11px] font-bold"
                          title="Chỉnh sửa số tiền"
                        >
                          ✏️
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 3. CHẾ ĐỘ: BÀN PHÍM SỐ FINTECH (NUMPAD CALCULATOR) */}
            {inputMode === 'numpad' && (
              <form onSubmit={handleNumpadSubmit} className="space-y-4">
                <div className="p-4 rounded-2xl bg-zinc-900 text-white dark:bg-zinc-950 border border-zinc-800 flex flex-col justify-between">
                  <div className="flex justify-between items-center text-xs text-zinc-400">
                    <span>SỐ TIỀN CHI TIÊU</span>
                    <span className="text-emerald-400 font-bold">{note || 'Chưa có ghi chú'}</span>
                  </div>
                  <div className="my-2 flex items-baseline justify-between">
                    <span className="text-3xl sm:text-4xl font-black text-emerald-400 tracking-tight">
                      {amount ? formatVND(Number(amount)) : '0 đ'}
                    </span>
                    <button
                      type="button"
                      onClick={() => handleNumpadPress('C')}
                      className="text-xs text-zinc-400 hover:text-white px-2 py-1 rounded bg-zinc-800"
                    >
                      Xóa
                    </button>
                  </div>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => handleNumpadPress('+50k')} className="px-2 py-1 rounded bg-zinc-800 text-[11px] font-bold hover:bg-zinc-700">+50k</button>
                    <button type="button" onClick={() => handleNumpadPress('+100k')} className="px-2 py-1 rounded bg-zinc-800 text-[11px] font-bold hover:bg-zinc-700">+100k</button>
                    <button type="button" onClick={() => handleNumpadPress('+500k')} className="px-2 py-1 rounded bg-zinc-800 text-[11px] font-bold hover:bg-zinc-700">+500k</button>
                  </div>
                </div>

                {/* Chọn Quỹ Phân Bổ */}
                <div>
                  <span className="text-xs font-bold uppercase tracking-wider text-zinc-500">Chọn Hũ Quỹ</span>
                  <div className="grid grid-cols-3 gap-2 mt-1.5">
                    {funds.map(f => (
                      <button
                        key={f.id}
                        type="button"
                        onClick={() => setFundId(f.id)}
                        className={`p-2 rounded-xl border text-left text-xs font-bold transition flex items-center gap-1.5 ${
                          fundId === f.id
                            ? 'border-emerald-500 bg-emerald-50/50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 ring-2 ring-emerald-500/20'
                            : 'border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-850 text-zinc-700 dark:text-zinc-300'
                        }`}
                      >
                        <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: f.color }}></span>
                        <span className="truncate">{f.name.split(' ')[0]}</span>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Ghi chú & Ngày */}
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    placeholder="Ghi chú (vd: Mua đồ WinMart...)"
                    value={note}
                    onChange={(e) => setNote(e.target.value)}
                    className="w-full bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-xl px-3 py-2 text-xs font-semibold outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                  <input
                    type="date"
                    value={date}
                    onChange={(e) => setDate(e.target.value)}
                    className="w-full bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-xl px-3 py-2 text-xs font-semibold outline-none"
                  />
                </div>

                {/* BÀN PHÍM SỐ FINTECH NUMPAD */}
                <div className="grid grid-cols-3 gap-2">
                  {['1', '2', '3', '4', '5', '6', '7', '8', '9', '000', '0', 'DEL'].map((key) => (
                    <button
                      key={key}
                      type="button"
                      onClick={() => handleNumpadPress(key)}
                      className={`h-11 rounded-xl text-base font-extrabold transition active:scale-95 flex items-center justify-center ${
                        key === 'DEL'
                          ? 'bg-rose-100 hover:bg-rose-200 text-rose-700 dark:bg-rose-950 dark:text-rose-300'
                          : 'bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-900 dark:text-zinc-100'
                      }`}
                    >
                      {key === 'DEL' ? '⌫' : key}
                    </button>
                  ))}
                </div>

                {/* Nút đính kèm hóa đơn & OCR */}
                <div className="flex items-center justify-between pt-1">
                  <label className="text-xs font-bold text-zinc-500 hover:text-emerald-500 cursor-pointer flex items-center gap-1.5">
                    <span>📷</span> {ocrProcessing ? 'Đang đọc hóa đơn...' : 'Quét Hóa Đơn (OCR)'}
                    <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                  </label>
                  {receiptPreview && (
                    <span className="text-xs font-bold text-emerald-500 flex items-center gap-1">
                      ✓ Đã đính kèm ảnh
                    </span>
                  )}
                </div>

                <button
                  type="submit"
                  disabled={!amount || Number(amount) <= 0}
                  className={`w-full py-3.5 rounded-2xl font-bold text-sm transition shadow-lg flex items-center justify-center gap-2 ${
                    amount && Number(amount) > 0
                      ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-500/25 active:scale-98 cursor-pointer'
                      : 'bg-zinc-200 text-zinc-400 dark:bg-zinc-800 dark:text-zinc-600 cursor-not-allowed'
                  }`}
                >
                  Lưu Giao Dịch Vào Hũ
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    // MOUNT TO ROOT
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
